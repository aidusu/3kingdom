<!DOCTYPE html>

<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportPal 運動趨勢監測 Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        :root {
            --green:      #00c853;
            --green-glow: rgba(0,200,83,0.25);
            --dark:       #0d1117;
            --card:       #161b24;
            --card2:      #1e2535;
            --border:     #2a3245;
            --text:       #dde3f0;
            --muted:      #6b7898;
            --accent:     #3d9cf5;
            --orange:     #ff7043;
        }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Noto Sans TC', sans-serif;
        background: var(--dark);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 30px 16px 60px;
    }

    /* Subtle grid background */
    body::before {
        content: '';
        position: fixed; inset: 0;
        background-image:
            linear-gradient(rgba(0,200,83,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,200,83,0.03) 1px, transparent 1px);
        background-size: 44px 44px;
        pointer-events: none;
        z-index: 0;
    }

    .card {
        position: relative; z-index: 1;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        width: 100%; max-width: 800px;
        padding: 2.2rem 2rem;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* ── PAGE TOGGLE ── */
    #homePage, #chartPage { display: none; }
    #homePage.active, #chartPage.active { display: block; }

    /* ── HOME PAGE ── */
    .search-box { text-align: center; padding: 2.5rem 0; }

    .brand {
        font-family: 'Rajdhani', sans-serif;
        font-size: 2.8rem;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--green);
        text-shadow: 0 0 28px var(--green-glow);
        margin-bottom: 4px;
    }
    .brand span { color: var(--text); }

    .search-box p {
        color: var(--muted);
        font-size: 0.9rem;
        letter-spacing: 1px;
        margin: 8px 0 28px;
    }

    .input-row {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    input[type="text"] {
        padding: 13px 18px;
        width: 240px;
        background: var(--card2);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
        color: var(--text);
        font-family: 'Noto Sans TC', sans-serif;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(0,200,83,0.15);
    }

    button {
        padding: 13px 26px;
        background: var(--green);
        color: #0d1117;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        font-family: 'Noto Sans TC', sans-serif;
        letter-spacing: 1px;
        transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
    }
    button:hover { background: #00e676; box-shadow: 0 0 18px var(--green-glow); }
    button:active { transform: scale(0.97); }

    /* ── CHART PAGE ── */
    .back-btn {
        background: transparent;
        border: 1.5px solid var(--border);
        color: var(--muted);
        padding: 8px 18px;
        font-size: 13px;
        margin-bottom: 1.4rem;
        border-radius: 8px;
    }
    .back-btn:hover { border-color: var(--text); color: var(--text); box-shadow: none; }

    .header-info {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        margin-bottom: 2rem;
        padding-bottom: 1rem;
    }
    .header-info h2 {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.7rem;
        font-weight: 700;
        color: var(--green);
        letter-spacing: 2px;
    }
    .header-info span { color: var(--muted); font-size: 0.85rem; letter-spacing: 1px; }

    .chart-section { margin-bottom: 2.4rem; }

    h3 {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--muted);
        text-transform: uppercase;
        padding-left: 12px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    h3::before {
        content: '';
        display: inline-block;
        width: 3px; height: 15px;
        background: var(--green);
        border-radius: 2px;
        flex-shrink: 0;
    }
    /* blue accent for distance, orange for calorie */
    .section-dist h3::before { background: var(--accent); }
    .section-cal  h3::before { background: var(--orange); }

    .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
    }
    .chart-container.pie-container { height: 450px; }
</style>

</head>
<body>

<!-- ══ HOME PAGE ══ -->

<div id="homePage" class="card active">
    <div class="search-box">
        <div class="brand">Sport<span>Pal</span></div>
        <p>請輸入您的姓名以查看個人運動表現</p>
        <div class="input-row">
            <input type="text" id="nameInput" placeholder="請輸入姓名 (例如: Hermann)">
            <button onclick="searchUser()">查詢</button>
        </div>
    </div>
</div>

<!-- ══ CHART PAGE ══ -->

<div id="chartPage" class="card">
    <button class="back-btn" onclick="goHome()">← 返回搜尋</button>

```
<div class="header-info">
    <h2 id="displayUserName">姓名：--</h2>
    <span id="currentDate">日期：--</span>
</div>

<div class="chart-section section-dist">
    <h3>每月運動距離趨勢圖 (km)</h3>
    <div class="chart-container">
        <canvas id="distanceChart"></canvas>
    </div>
</div>

<div class="chart-section section-cal">
    <h3>每月運動卡路里趨勢圖 (kcal)</h3>
    <div class="chart-container">
        <canvas id="calorieChart"></canvas>
    </div>
</div>

<div class="chart-section">
    <h3>運動類型卡路里分布圖</h3>
    <div class="chart-container pie-container">
        <canvas id="typePieChart"></canvas>
    </div>
</div>

</div>

<script>
    Chart.register(ChartDataLabels);

    const userData = [
        ["Hermann", 7134, 11662, 1776, 0, 193, 171, 207, 223, 245, 242, 15748, 13136, 20007, 17629, 20565, 18272],
        ["Tom", 80000, 20000, 10000, 40000, 50, 91, 32, 53, 54, 65, 128000, 130000, 145000, 150000, 140000, 150000],
        ["John", 10000, 30000, 10000, 0, 15, 18, 32, 25, 35, 50, 128000, 100000, 185000, 190000, 100000, 50000],
        ["Mary", 20000,  10000, 30000, 40000, 120, 119, 118, 116, 118, 120, 100000,  90000,  80000,  70000,  80000, 100000]
    ];

    const months     = ["前六月", "前五月", "前四月", "前三月", "上上個月", "上個月"];
    const sportTypes = ["跑步", "步行", "單車", "其他"];
    let charts = {};

    document.getElementById('nameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') searchUser();
    });

    function searchUser() {
        const name = document.getElementById('nameInput').value.trim();
        const user = userData.find(u => u[0].toLowerCase() === name.toLowerCase());
        if (user) { showCharts(user); }
        else { alert("找不到該用戶資料，請檢查姓名是否正確。"); }
    }

    function showCharts(user) {
        document.getElementById('homePage').classList.remove('active');
        document.getElementById('chartPage').classList.add('active');

        document.getElementById('displayUserName').innerText = `姓名：${user[0]}`;
        document.getElementById('currentDate').innerText =
            `日期：${new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric' })}`;

        if (charts.dist) charts.dist.destroy();
        if (charts.cal)  charts.cal.destroy();
        if (charts.pie)  charts.pie.destroy();

        charts.dist = createBarChart('distanceChart', months, user.slice(5, 11),  '#3d9cf5', '距離 (km)');
        charts.cal  = createBarChart('calorieChart',  months, user.slice(11, 17), '#ff7043', '卡路里 (kcal)');

        const pieData   = user.slice(1, 5);
        const pieTotal  = pieData.reduce((a, b) => a + b, 0);
        const pieColors = ['#3d9cf5', '#00c853', '#ff7043', '#ab47bc'];

        charts.pie = new Chart(document.getElementById('typePieChart'), {
            type: 'pie',
            data: {
                labels: sportTypes,
                datasets: [{
                    data: pieData,
                    backgroundColor: pieColors,
                    borderColor: '#1e2535',
                    borderWidth: 2,
                    hoverOffset: 14
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: 44 },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#6b7898', padding: 16, font: { size: 13 } }
                    },
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold', size: 12 },
                        textAlign: 'center',
                        textShadowBlur: 4,
                        textShadowColor: 'rgba(0,0,0,0.6)',
                        formatter: (value, ctx) => {
                            const pct   = (value / pieTotal * 100).toFixed(1) + '%';
                            const label = ctx.chart.data.labels[ctx.dataIndex];
                            return `${label}\n${value.toLocaleString()}\n(${pct})`;
                        }
                    }
                }
            }
        });
    }

    function createBarChart(id, labels, data, color, labelName) {
        const ctx = document.getElementById(id).getContext('2d');

        const gradient = ctx.createLinearGradient(0, 0, 0, 280);
        gradient.addColorStop(0, color + 'cc');
        gradient.addColorStop(1, color + '22');

        return new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [{
                    label: labelName,
                    data,
                    backgroundColor: gradient,
                    borderColor: color,
                    borderWidth: 1.5,
                    borderRadius: 6,
                    borderSkipped: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { top: 28 } },
                plugins: {
                    legend: {
                        labels: { color: '#6b7898', font: { size: 12 } }
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#b0b8cc',
                        font: { weight: 'bold', size: 11 },
                        formatter: v => v.toLocaleString()
                    }
                },
                scales: {
                    x: {
                        grid:  { display: false },
                        ticks: { color: '#6b7898' }
                    },
                    y: {
                        beginAtZero: false,
                        grid:  { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#6b7898' }
                    }
                }
            }
        });
    }

    function goHome() {
        document.getElementById('chartPage').classList.remove('active');
        document.getElementById('homePage').classList.add('active');
    }
</script>

</body>
</html>
