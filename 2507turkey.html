<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土耳其之旅 2025</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap');
 
  :root {
    --bg:       #0d1117;
    --panel:    #161b22;
    --border:   #30363d;
    --gold:     #d4a853;
    --gold2:    #f0c97a;
    --red:      #c0392b;
    --text:     #e6edf3;
    --muted:    #8b949e;
    --accent:   #58a6ff;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
 
  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
 
  #header-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
 
  #header-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
 
  /* progress bar */
  #prog-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    min-width: 60px;
  }
  #prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold2));
    width: 0%;
    transition: width 0.25s;
    border-radius: 2px;
  }
 
  /* status chip */
  #status-chip {
    font-size: 11px;
    color: var(--gold2);
    background: rgba(212,168,83,0.12);
    border: 1px solid rgba(212,168,83,0.25);
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
    min-width: 120px;
    text-align: center;
  }
 
  /* control buttons */
  .ctrl-btn {
    background: var(--border);
    border: 1px solid #484f58;
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: #21262d; }
  .ctrl-btn.active { background: rgba(212,168,83,0.18); border-color: var(--gold); color: var(--gold); }
 
  /* speed label */
  #speed-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
 
  /* ── Map ── */
  #map { flex: 1; position: relative; }
 
  /* ── Info card (popup on map) ── */
  #info-card {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(22, 27, 34, 0.94);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 10px 18px;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 1px rgba(212,168,83,0.1);
    max-width: 90vw;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  #info-card.hidden { opacity: 0; }
 
  #info-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    box-shadow: 0 0 8px var(--gold);
  }
 
  #info-date {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
 
  #info-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--gold2);
    margin-top: 2px;
  }
 
  #info-counter {
    font-size: 10px;
    color: var(--muted);
    margin-left: auto;
    padding-left: 12px;
    white-space: nowrap;
  }
 
  /* ── Custom Leaflet popup ── */
  .leaflet-popup-content-wrapper {
    background: rgba(13,17,23,0.96) !important;
    border: 1px solid var(--gold) !important;
    border-radius: 8px !important;
    color: var(--text) !important;
    font-family: 'Noto Sans TC', sans-serif !important;
    font-size: 12px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6) !important;
    padding: 0 !important;
  }
  .leaflet-popup-content {
    margin: 10px 14px !important;
    line-height: 1.5 !important;
  }
  .leaflet-popup-tip { background: var(--gold) !important; }
  .leaflet-popup-close-button { color: var(--muted) !important; top: 4px !important; right: 6px !important; }
  .pop-date { font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
  .pop-name { font-size: 13px; color: var(--gold2); font-weight: 500; margin-top: 2px; }
 
  /* day color legend sidebar */
  #day-legend {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(22,27,34,0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    z-index: 900;
    font-size: 11px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  #day-legend h4 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .legend-row:hover { background: rgba(255,255,255,0.05); }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-label { color: var(--text); }
  .legend-label.muted { color: var(--muted); text-decoration: line-through; }
</style>
</head>

<div id="header">

  </select>
  <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">⏸ 暫停</button>
  <button class="ctrl-btn" onclick="restartAll()">↺ 重播</button>
</div>
 
<div id="map">
  <div id="info-card" class="hidden">
    <div id="info-dot"></div>
    <div>
      <div id="info-date"></div>
      <div id="info-name"></div>
    </div>
    <div id="info-counter"></div>
  </div>
  <div id="day-legend"><h4>日期</h4></div>
</div>

/* ── OSRM ── */
const roadCache = {};
async function getRoadCoords(a, b) {
  const key = `${a.Latitude},${a.Longitude}|${b.Latitude},${b.Longitude}`;
  if (roadCache[key]) return roadCache[key];
  // 跨國長距離超過 1.5 度直接用直線（OSRM 跨國效果差）
  const dist = Math.hypot(a.Latitude - b.Latitude, a.Longitude - b.Longitude);
  if (dist > 2.5) return [[a.Latitude, a.Longitude], [b.Latitude, b.Longitude]];
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${a.Longitude},${a.Latitude};${b.Longitude},${b.Latitude}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const json = await res.json();
    if (json.code !== 'Ok' || !json.routes?.length) throw new Error();
    const coords = json.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
    roadCache[key] = coords;
    return coords;
  } catch {
    return [[a.Latitude, a.Longitude], [b.Latitude, b.Longitude]];
  }
}
 
/* ── 播放狀態 ── */
let timer = null;
let allMarkers = [];
let allPolylines = [];
let playing = false;
let paused = false;
 
const sleep = ms => new Promise(r => setTimeout(r, ms));
const setStatus = t => document.getElementById('status-chip').textContent = t;
const setProgress = p => document.getElementById('prog-fill').style.width = Math.min(p,100) + '%';
 
function showCard(pt, idx) {
  const c = document.getElementById('info-card');
  document.getElementById('info-date').textContent = pt.Date.replace('2025-','');
  document.getElementById('info-name').textContent = pt.Location;
  document.getElementById('info-counter').textContent = `${idx + 1} / ${RAW.length}`;
  document.getElementById('info-dot').style.background = DAY_COLORS[pt.Date] || '#d4a853';
  c.classList.remove('hidden');
}
 
function addMarker(pt, color, idx) {
  const isFirst = idx === 0;
  const isLast = idx === RAW.length - 1;
  const r = (isFirst || isLast) ? 7 : 5;
  const m = L.circleMarker([pt.Latitude, pt.Longitude], {
    radius: r,
    color: isFirst || isLast ? '#fff' : 'rgba(255,255,255,0.4)',
    fillColor: color,
    fillOpacity: 1,
    weight: isFirst || isLast ? 2 : 1
  }).addTo(map).bindPopup(
    `<div class="pop-date">${pt.Date.replace('2025-','')}</div>
     <div class="pop-name">${pt.Location}</div>`
  );
  allMarkers.push(m);
}
 
function animateSegment(polyline, coords) {
  return new Promise(resolve => {
    let idx = 0;
    const interval = parseInt(document.getElementById('speed-sel').value);
    timer = setInterval(() => {
      if (!playing) { clearInterval(timer); timer = null; resolve(); return; }
      if (paused) return; // 暫停時跳過
      if (idx >= coords.length) { clearInterval(timer); timer = null; resolve(); return; }
      polyline.addLatLng(coords[idx++]);
    }, interval);
  });
}
 
function clearAll() {
  if (timer) { clearInterval(timer); timer = null; }
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];
  allPolylines.forEach(l => map.removeLayer(l));
  allPolylines = [];
  playing = false; paused = false;
  document.getElementById('info-card').classList.add('hidden');
  // reset legend
  Object.keys(DAY_LABELS).forEach(d => {
    const el = document.getElementById('leg-' + d);
    if (el) el.querySelector('.legend-label').className = 'legend-label muted';
  });
}
 
async function startPlayback() {
  clearAll();
  playing = true;
 
  const bounds = L.latLngBounds(RAW.map(p => [p.Latitude, p.Longitude]));
  map.fitBounds(bounds, { padding: [40, 160] });
 
  let currentDay = null;
  let polyline = null;
 
  for (let i = 0; i < RAW.length; i++) {
    if (!playing) return;
 
    const pt = RAW[i];
    const color = DAY_COLORS[pt.Date] || '#d4a853';
 
    // 新的一天 → 新 polyline
    if (pt.Date !== currentDay) {
      currentDay = pt.Date;
      polyline = L.polyline([], {
        color, weight: 2.5, opacity: 0.9,
        lineJoin: 'round', lineCap: 'round'
      }).addTo(map);
      allPolylines.push(polyline);
      // 亮起圖例
      const legEl = document.getElementById('leg-' + pt.Date);
      if (legEl) legEl.querySelector('.legend-label').className = 'legend-label';
      setStatus(DAY_LABELS[pt.Date] || pt.Date);
    }
 
    addMarker(pt, color, i);
    showCard(pt, i);
    setProgress((i / RAW.length) * 100);
 
    if (i < RAW.length - 1) {
      const next = RAW[i + 1];
      // 跨天或飛行段 → 虛線
      const isAir = Math.hypot(pt.Latitude - next.Latitude, pt.Longitude - next.Longitude) > 2.5 && pt.Date !== next.Date;
      if (isAir) {
        // 直線動畫
        await animateSegment(polyline, [[pt.Latitude, pt.Longitude], [next.Latitude, next.Longitude]]);
      } else {
        const coords = await getRoadCoords(pt, next);
        if (!playing) return;
        await animateSegment(polyline, coords);
      }
    }
  }
 
  setStatus('旅程結束 ✈️');
  setProgress(100);
}
 
function restartAll() {
  clearAll();
  paused = false;
  document.getElementById('pause-btn').textContent = '⏸ 暫停';
  document.getElementById('pause-btn').classList.remove('active');
  startPlayback();
}
 
function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pause-btn');
  btn.textContent = paused ? '▶ 繼續' : '⏸ 暫停';
  btn.classList.toggle('active', paused);
}
 
/* ── 啟動 ── */
startPlayback();
</script>
