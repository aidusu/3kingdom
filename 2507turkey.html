<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>土耳其之旅 2025</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@300;400;500&display=swap');

:root{
  --bg:#f5f1e8;
  --panel:#ffffff;
  --border:#d8d2c7;
  --gold:#c28b2c;
  --gold2:#e6b85c;
  --text:#2b2b2b;
  --muted:#7b7b7b;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Header */
#header{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 18px;
  background:rgba(255,255,255,0.92);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
  z-index:10;
}

#header-title{
  font-family:'Playfair Display',serif;
  font-size:20px;
  color:var(--gold);
}

#header-sub{
  font-size:11px;
  color:var(--muted);
}

#prog-track{
  flex:1;
  height:4px;
  background:#ece7de;
  border-radius:999px;
  overflow:hidden;
}

#prog-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .15s linear;
}

#status-chip{
  font-size:11px;
  color:var(--gold);
  background:#fff6e8;
  border:1px solid #ecd3a2;
  padding:4px 12px;
  border-radius:999px;
}

.ctrl-btn{
  background:#fff;
  border:1px solid #d6d0c4;
  color:#333;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

.ctrl-btn:hover{
  background:#f7f3ec;
}

.ctrl-btn.active{
  background:#fff4df;
  border-color:var(--gold);
  color:var(--gold);
}

#map{
  flex:1;
  position:relative;
}

/* 底部日期路線板 */
#day-legend{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);

  z-index:999;

  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;

  background:rgba(255,255,255,0.92);
  border:1px solid var(--border);
  border-radius:14px;

  padding:10px 16px;

  backdrop-filter:blur(10px);

  box-shadow:0 4px 20px rgba(0,0,0,0.08);

  max-width:90vw;
}

#day-legend h4{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.08em;
  margin-right:4px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}

.legend-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  flex-shrink:0;
}

.legend-label{
  font-size:12px;
  color:#444;
}

.legend-label.muted{
  opacity:.45;
}

/* popup */
.leaflet-popup-content-wrapper{
  border-radius:10px !important;
}

/* 手機版 */
@media (max-width:768px){

  #header{
    flex-wrap:wrap;
  }

  #day-legend{
    width:95%;
    justify-content:flex-start;
    overflow-x:auto;
    flex-wrap:nowrap;
    padding:10px 12px;
  }

  .legend-label{
    font-size:11px;
  }
}
</style>
</head>

<body>

  <div>
    <div id="header-title">🕌 土耳其之旅 2025</div>
    <div id="header-sub">Jul 31 – Aug 11 · Turkey Road Trip</div>
  </div>

  <div id="prog-track">
    <div id="prog-fill"></div>
  </div>

  <div id="status-chip">準備中…</div>

  <!-- 加快播放速度 -->
  <select id="speed-sel" class="ctrl-btn">
    <option value="8">超快</option>
    <option value="15" selected>快速</option>
    <option value="30">正常</option>
  </select>

  <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">
    ⏸ 暫停
  </button>

  <button class="ctrl-btn" onclick="restartAll()">
    ↺ 重播
  </button>
</div>

<div id="map">

  <div id="day-legend">
    <h4>每日路線</h4>
  </div>

</div>

/* ── 每日顏色 ── */
const DAY_COLORS = {
  '2025-07-31': '#d97706',
  '2025-08-01': '#22c55e',
  '2025-08-02': '#3b82f6',
  '2025-08-03': '#ef4444',
  '2025-08-04': '#a855f7',
  '2025-08-05': '#10b981',
  '2025-08-06': '#f97316',
  '2025-08-07': '#8b5cf6',
  '2025-08-08': '#0ea5e9',
  '2025-08-09': '#ec4899',
  '2025-08-10': '#eab308',
  '2025-08-11': '#65a30d',
};

const DAY_LABELS = {
  '2025-07-31': '7/31 伊斯坦堡→番紅花城',
  '2025-08-01': '8/01 番紅花→安卡拉→卡帕',
  '2025-08-02': '8/02 卡帕多其亞探索',
  '2025-08-03': '8/03 熱氣球升空',
  '2025-08-04': '8/04 卡帕→孔亞',
  '2025-08-05': '8/05 孔亞→安塔利亞',
  '2025-08-06': '8/06 安塔利亞→棉堡',
  '2025-08-07': '8/07 棉堡→以弗所→庫薩達斯',
  '2025-08-08': '8/08 庫薩達斯→伊斯坦堡',
  '2025-08-09': '8/09 伊斯坦堡古城',
  '2025-08-10': '8/10 遊船→托普卡匹→回國',
  '2025-08-11': '8/11 登機',
};

/* ── 地圖初始化（淺色地圖） ── */
const map = L.map('map',{
  zoomControl:false
}).setView([39,32],6);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'© OpenStreetMap',
    maxZoom:19
  }
).addTo(map);

L.control.zoom({
  position:'bottomright'
}).addTo(map);

/* ── 建立底部路線板 ── */
const legendEl = document.getElementById('day-legend');

Object.entries(DAY_LABELS).forEach(([date,label])=>{

  const row = document.createElement('div');

  row.className='legend-row';
  row.id='leg-'+date;

  row.innerHTML=`
    <div
      class="legend-dot"
      style="background:${DAY_COLORS[date]}"
    ></div>

    <span class="legend-label muted">
      ${label}
    </span>
  `;

  legendEl.appendChild(row);
});

/* ── 路線快取 ── */
const roadCache = {};

async function getRoadCoords(a,b){

  const key =
    `${a.Latitude},${a.Longitude}|${b.Latitude},${b.Longitude}`;

  if(roadCache[key]){
    return roadCache[key];
  }

  const dist = Math.hypot(
    a.Latitude - b.Latitude,
    a.Longitude - b.Longitude
  );

  /* 太遠直接畫直線 */
  if(dist > 2.5){

    return [
      [a.Latitude,a.Longitude],
      [b.Latitude,b.Longitude]
    ];
  }

  try{

    const url =
      `https://router.project-osrm.org/route/v1/driving/`+
      `${a.Longitude},${a.Latitude};`+
      `${b.Longitude},${b.Latitude}`+
      `?overview=full&geometries=geojson`;

    const res = await fetch(url);

    const json = await res.json();

    const coords =
      json.routes[0].geometry.coordinates.map(
        ([lng,lat])=>[lat,lng]
      );

    roadCache[key]=coords;

    return coords;

  }catch{

    return [
      [a.Latitude,a.Longitude],
      [b.Latitude,b.Longitude]
    ];
  }
}

/* ── 播放狀態 ── */
let timer = null;
let allMarkers = [];
let allPolylines = [];
let playing = false;
let paused = false;

/* UI */
const setStatus = t=>{
  document.getElementById('status-chip').textContent=t;
};

const setProgress = p=>{
  document.getElementById('prog-fill').style.width =
    Math.min(p,100)+'%';
};

/* Marker（不顯示資訊） */
function addMarker(pt,color,idx){

  const isFirst = idx===0;
  const isLast  = idx===RAW.length-1;

  const marker = L.circleMarker(
    [pt.Latitude,pt.Longitude],
    {
      radius:(isFirst||isLast)?6:4,
      color:'#ffffff',
      weight:1.5,
      fillColor:color,
      fillOpacity:1
    }
  ).addTo(map);

  allMarkers.push(marker);
}

/* 線段動畫 */
function animateSegment(polyline,coords){

  return new Promise(resolve=>{

    let idx = 0;

    const interval =
      parseInt(
        document.getElementById('speed-sel').value
      );

    timer = setInterval(()=>{

      if(!playing){

        clearInterval(timer);
        resolve();
        return;
      }

      if(paused){
        return;
      }

      if(idx >= coords.length){

        clearInterval(timer);
        resolve();
        return;
      }

      polyline.addLatLng(coords[idx++]);

    },interval);
  });
}

/* 清除 */
function clearAll(){

  if(timer){
    clearInterval(timer);
  }

  allMarkers.forEach(m=>map.removeLayer(m));
  allPolylines.forEach(l=>map.removeLayer(l));

  allMarkers=[];
  allPolylines=[];

  playing=false;
  paused=false;

  Object.keys(DAY_LABELS).forEach(d=>{

    const el =
      document.getElementById('leg-'+d);

    if(el){

      el.querySelector('.legend-label').className =
        'legend-label muted';
    }
  });
}

/* 開始播放 */
async function startPlayback(){

  clearAll();

  playing = true;

  const bounds = L.latLngBounds(
    RAW.map(p=>[p.Latitude,p.Longitude])
  );

  map.fitBounds(bounds,{
    padding:[40,120]
  });

  let currentDay = null;
  let polyline = null;

  for(let i=0;i<RAW.length;i++){

    if(!playing){
      return;
    }

    const pt = RAW[i];

    const color =
      DAY_COLORS[pt.Date] || '#d97706';

    /* 新的一天 */
    if(pt.Date !== currentDay){

      currentDay = pt.Date;

      polyline = L.polyline([],{
        color,
        weight:4,
        opacity:.9,
        lineJoin:'round',
        lineCap:'round'
      }).addTo(map);

      allPolylines.push(polyline);

      const legEl =
        document.getElementById('leg-'+pt.Date);

      if(legEl){

        legEl.querySelector('.legend-label').className =
          'legend-label';
      }

      setStatus(
        DAY_LABELS[pt.Date] || pt.Date
      );
    }

    addMarker(pt,color,i);

    setProgress(
      (i / RAW.length) * 100
    );

    if(i < RAW.length - 1){

      const next = RAW[i+1];

      const coords =
        await getRoadCoords(pt,next);

      await animateSegment(polyline,coords);
    }
  }

  setStatus('旅程結束 ✈️');

  setProgress(100);
}

/* 重播 */
function restartAll(){

  clearAll();

  paused=false;

  document.getElementById('pause-btn').textContent =
    '⏸ 暫停';

  startPlayback();
}

/* 暫停 */
function togglePause(){

  paused=!paused;

  document.getElementById('pause-btn').textContent =
    paused ? '▶ 繼續' : '⏸ 暫停';
}

/* 啟動 */
startPlayback();

</script>
