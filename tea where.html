<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友位 · 即時位置分享</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #13161e;
    --card: #1a1e2a;
    --border: #252a38;
    --accent: #4fffb0;
    --accent2: #ff6b6b;
    --accent3: #ffd166;
    --text: #e8eaf0;
    --muted: #6b7280;
    --me-color: #4fffb0;
    --friend1: #ff6b6b;
    --friend2: #ffd166;
    --friend3: #a78bfa;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Noto Sans TC’, sans-serif;
background: var(–bg);
color: var(–text);
height: 100vh;
display: flex;
flex-direction: column;
overflow: hidden;
}

/* Header */
header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 12px 20px;
background: var(–panel);
border-bottom: 1px solid var(–border);
z-index: 1000;
flex-shrink: 0;
}

.logo {
font-family: ‘Space Mono’, monospace;
font-size: 18px;
font-weight: 700;
color: var(–accent);
letter-spacing: -0.5px;
}
.logo span { color: var(–text); }

.status-pill {
display: flex;
align-items: center;
gap: 6px;
background: rgba(79,255,176,0.08);
border: 1px solid rgba(79,255,176,0.2);
border-radius: 20px;
padding: 4px 12px;
font-size: 12px;
color: var(–accent);
font-family: ‘Space Mono’, monospace;
}
.pulse {
width: 7px; height: 7px;
background: var(–accent);
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse {
0%,100%{ opacity:1; transform:scale(1); }
50%{ opacity:0.4; transform:scale(1.3); }
}

/* Main layout */
.main {
display: flex;
flex: 1;
overflow: hidden;
}

/* Sidebar */
.sidebar {
width: 280px;
background: var(–panel);
border-right: 1px solid var(–border);
display: flex;
flex-direction: column;
overflow: hidden;
flex-shrink: 0;
}

.sidebar-title {
padding: 16px 16px 8px;
font-size: 11px;
font-family: ‘Space Mono’, monospace;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 1.5px;
}

.people-list {
flex: 1;
overflow-y: auto;
padding: 0 12px 12px;
}
.people-list::-webkit-scrollbar { width: 4px; }
.people-list::-webkit-scrollbar-thumb { background: var(–border); border-radius: 2px; }

.person-card {
background: var(–card);
border: 1px solid var(–border);
border-radius: 12px;
padding: 12px;
margin-bottom: 8px;
cursor: pointer;
transition: all 0.2s;
position: relative;
overflow: hidden;
}
.person-card:hover { border-color: rgba(79,255,176,0.3); transform: translateX(2px); }
.person-card.active { border-color: var(–accent); }
.person-card::before {
content: ‘’;
position: absolute;
left: 0; top: 0; bottom: 0;
width: 3px;
border-radius: 3px 0 0 3px;
background: var(–color, var(–accent));
}

.person-top {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 8px;
}
.avatar {
width: 36px; height: 36px;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 16px;
font-weight: 600;
flex-shrink: 0;
border: 2px solid var(–color, var(–accent));
}
.person-name { font-size: 14px; font-weight: 600; }
.person-status { font-size: 11px; color: var(–muted); }

.distance-badge {
background: rgba(255,255,255,0.05);
border: 1px solid var(–border);
border-radius: 6px;
padding: 5px 10px;
font-size: 12px;
font-family: ‘Space Mono’, monospace;
display: flex;
justify-content: space-between;
align-items: center;
}
.distance-value { color: var(–color, var(–accent)); font-weight: 700; }
.distance-label { color: var(–muted); }

/* Map container */
.map-wrapper {
flex: 1;
position: relative;
}

#map {
width: 100%;
height: 100%;
}

/* Bottom controls */
.controls {
position: absolute;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
display: flex;
gap: 10px;
z-index: 500;
}

.btn {
display: flex;
align-items: center;
gap: 8px;
padding: 10px 18px;
border-radius: 50px;
border: none;
font-family: ‘Noto Sans TC’, sans-serif;
font-size: 13px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s;
backdrop-filter: blur(8px);
white-space: nowrap;
}
.btn-primary {
background: var(–accent);
color: #0d0f14;
}
.btn-primary:hover { background: #6bffbe; transform: translateY(-2px); }
.btn-secondary {
background: rgba(19,22,30,0.9);
color: var(–text);
border: 1px solid var(–border);
}
.btn-secondary:hover { border-color: var(–accent); color: var(–accent); transform: translateY(-2px); }

/* Tooltip overlay */
.map-hint {
position: absolute;
top: 16px;
left: 50%;
transform: translateX(-50%);
background: rgba(13,15,20,0.85);
border: 1px solid var(–border);
border-radius: 8px;
padding: 8px 16px;
font-size: 12px;
color: var(–muted);
backdrop-filter: blur(8px);
z-index: 500;
pointer-events: none;
white-space: nowrap;
}

/* Info panel */
.info-panel {
padding: 12px 16px;
border-top: 1px solid var(–border);
font-size: 11px;
color: var(–muted);
font-family: ‘Space Mono’, monospace;
line-height: 1.8;
}
.info-panel .coords { color: var(–accent); }

/* Leaflet overrides */
.leaflet-container { background: #1a1e2a; }
.leaflet-tile { filter: brightness(0.7) saturate(0.6) hue-rotate(180deg); }
.leaflet-control-zoom a {
background: var(–card) !important;
color: var(–text) !important;
border-color: var(–border) !important;
}
.leaflet-control-zoom a:hover { background: var(–border) !important; }
.leaflet-control-attribution { display: none; }

/* Custom popups */
.leaflet-popup-content-wrapper {
background: var(–card);
border: 1px solid var(–border);
border-radius: 10px;
color: var(–text);
font-family: ‘Noto Sans TC’, sans-serif;
box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.leaflet-popup-tip { background: var(–card); }
.leaflet-popup-content { margin: 10px 14px; font-size: 13px; }

.popup-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.popup-coord { font-family: ‘Space Mono’, monospace; font-size: 11px; color: var(–muted); }

/* Loading */
.loading-overlay {
position: absolute;
inset: 0;
background: var(–bg);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 2000;
gap: 16px;
transition: opacity 0.5s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-ring {
width: 50px; height: 50px;
border: 3px solid var(–border);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-family: ‘Space Mono’, monospace; font-size: 13px; color: var(–muted); }
</style>

</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-ring"></div>
  <div class="loading-text">取得位置中...</div>
</div>

<header>
  <div class="logo">友<span>位</span></div>
  <div class="status-pill"><div class="pulse"></div> 即時同步中</div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-title">群組成員</div>
    <div class="people-list" id="peopleList"></div>
    <div class="info-panel" id="myCoords">
      我的座標：<br>
      <span class="coords" id="coordText">等待定位...</span>
    </div>
  </div>

  <div class="map-wrapper">
    <div class="map-hint">💡 點擊地圖可移動你的位置</div>
    <div id="map"></div>
    <div class="controls">
      <button class="btn btn-primary" onclick="locateMe()">📍 回到我的位置</button>
      <button class="btn btn-secondary" onclick="randomizeFriends()">🎲 隨機移動朋友</button>
    </div>
  </div>
</div>

<script>
const friends = [
  { id: 'me',      name: '我',    emoji: '😊', color: '#4fffb0', bg: 'rgba(79,255,176,0.15)' },
  { id: 'alice',   name: 'Alice', emoji: '🌸', color: '#ff6b6b', bg: 'rgba(255,107,107,0.15)' },
  { id: 'bob',     name: 'Bob',   emoji: '🎮', color: '#ffd166', bg: 'rgba(255,209,102,0.15)' },
  { id: 'charlie', name: 'Charlie',emoji:'🎸', color: '#a78bfa', bg: 'rgba(167,139,250,0.15)' },
];

let map, markers = {}, positions = {};
let myLat = 25.0330, myLng = 121.5654; // 預設台北101

function initMap(lat, lng) {
  myLat = lat; myLng = lng;

  map = L.map('map', { zoomControl: true }).setView([lat, lng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
  }).addTo(map);

  // Set initial positions
  positions['me'] = { lat, lng };
  positions['alice']   = { lat: lat + 0.008, lng: lng - 0.012 };
  positions['bob']     = { lat: lat - 0.006, lng: lng + 0.015 };
  positions['charlie'] = { lat: lat + 0.014, lng: lng + 0.008 };

  friends.forEach(f => createMarker(f));
  renderSidebar();
  updateCoordDisplay();

  // Click map to move "me"
  map.on('click', (e) => {
    positions['me'] = { lat: e.latlng.lat, lng: e.latlng.lng };
    myLat = e.latlng.lat; myLng = e.latlng.lng;
    updateMarker('me');
    renderSidebar();
    updateCoordDisplay();
  });

  document.getElementById('loading').classList.add('hidden');
}

function makeIcon(friend) {
  return L.divIcon({
    className: '',
    html: `
      <div style="
        width:44px;height:44px;
        background:${friend.bg};
        border:2.5px solid ${friend.color};
        border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        font-size:20px;
        box-shadow:0 0 0 4px ${friend.color}30, 0 4px 12px rgba(0,0,0,0.4);
        transition:transform 0.3s;
      ">${friend.emoji}</div>
      <div style="
        text-align:center;margin-top:3px;
        font-family:'Noto Sans TC',sans-serif;
        font-size:11px;font-weight:700;
        color:${friend.color};
        text-shadow:0 1px 4px rgba(0,0,0,0.8);
        white-space:nowrap;
      ">${friend.name}</div>`,
    iconSize: [44, 60],
    iconAnchor: [22, 22],
    popupAnchor: [0, -26],
  });
}

function createMarker(friend) {
  const pos = positions[friend.id];
  const marker = L.marker([pos.lat, pos.lng], { icon: makeIcon(friend) })
    .addTo(map)
    .bindPopup(`
      <div class="popup-name" style="color:${friend.color}">${friend.emoji} ${friend.name}</div>
      <div class="popup-coord">${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}</div>
    `);
  markers[friend.id] = marker;
}

function updateMarker(id) {
  const friend = friends.find(f => f.id === id);
  const pos = positions[id];
  markers[id].setLatLng([pos.lat, pos.lng]);
  markers[id].setPopupContent(`
    <div class="popup-name" style="color:${friend.color}">${friend.emoji} ${friend.name}</div>
    <div class="popup-coord">${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}</div>
  `);
}

function calcDistance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  const d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return d < 1000 ? `${Math.round(d)} 公尺` : `${(d/1000).toFixed(1)} 公里`;
}

function renderSidebar() {
  const list = document.getElementById('peopleList');
  list.innerHTML = '';

  friends.forEach(f => {
    const pos = positions[f.id];
    const isMe = f.id === 'me';
    const dist = isMe ? '—' : calcDistance(myLat, myLng, pos.lat, pos.lng);

    const card = document.createElement('div');
    card.className = 'person-card' + (isMe ? ' active' : '');
    card.style.setProperty('--color', f.color);
    card.innerHTML = `
      <div class="person-top">
        <div class="avatar" style="background:${f.bg};border-color:${f.color}">${f.emoji}</div>
        <div>
          <div class="person-name">${f.name}</div>
          <div class="person-status">${isMe ? '📍 這是你' : '🟢 線上'}</div>
        </div>
      </div>
      <div class="distance-badge">
        <span class="distance-label">${isMe ? '我的位置' : '距離我'}</span>
        <span class="distance-value">${dist}</span>
      </div>`;
    card.onclick = () => {
      map.setView([pos.lat, pos.lng], 15, { animate: true });
      markers[f.id].openPopup();
    };
    list.appendChild(card);
  });
}

function updateCoordDisplay() {
  document.getElementById('coordText').textContent =
    `${myLat.toFixed(5)}, ${myLng.toFixed(5)}`;
}

function locateMe() {
  map.setView([myLat, myLng], 15, { animate: true });
  markers['me'].openPopup();
}

function randomizeFriends() {
  ['alice', 'bob', 'charlie'].forEach(id => {
    positions[id] = {
      lat: myLat + (Math.random() - 0.5) * 0.04,
      lng: myLng + (Math.random() - 0.5) * 0.04,
    };
    updateMarker(id);
  });
  renderSidebar();
}

// Init
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => initMap(pos.coords.latitude, pos.coords.longitude),
    ()  => initMap(25.0330, 121.5654) // fallback 台北
  );
} else {
  initMap(25.0330, 121.5654);
}
</script>

</body>
</html>
