<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Sheet 句子搜尋</title>
</head>
<body>
  <input type="text" id="keyword" placeholder="輸入關鍵字">
  <button onclick="search()">搜尋</button>
  <ul id="results"></ul>

  <script>
    function search() {
      var q = document.getElementById('keyword').value;
      fetch('https://script.google.com/macros/s/AKfycbyu89kQW-5ZzeNMI6knEBaNeXdbv4dyPu-paei2F-MRdt70lELpbf2l65vlbtowbB1o/exec?q=' + encodeURIComponent(q))
        .then(response => response.json())
        .then(data => {
          var ul = document.getElementById('results');
          ul.innerHTML = '';
          data.forEach(function(sentence) {
            var li = document.createElement('li');
            li.textContent = sentence;
            ul.appendChild(li);
          });
        });
    }
  </script>
</body>
</html>
