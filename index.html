<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>閱讀紀錄表單</title>
  <style>
    label { display: block; margin-top: 10px; }
    #message { margin-top: 15px; color: green; font-weight: bold; }
    button { margin-top: 15px; }
  </style>
</head>
<body>
  <form id="readingForm">
    <label>日期：
      <input type="date" id="inputDate" required>
    </label>
    <label>主題：
      <input type="text" id="inputTopic" required>
    </label>
    <label>書本代碼：
      <input type="text" id="inputCode" required>
    </label>
    <label>每日心得：
      <textarea id="inputNote" rows="4" required></textarea>
    </label>
    <button type="submit" id="submitBtn">送出</button>
  </form>

  <div id="message"></div>

<script>
document.getElementById('readingForm').onsubmit = async (e) => {
  e.preventDefault();
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('message').textContent = '送出中...';

  const formData = {
    date: document.getElementById('inputDate').value,
    topic: document.getElementById('inputTopic').value,
    code: document.getElementById('inputCode').value,
    note: document.getElementById('inputNote').value
  };

  try {
    const response = await fetch('https://script.google.com/macros/s/AKfycbw0u_17l8CLELh929t4v5RnF74E4QDDw6r5RVe9vxuz1o2pkdcemQRkEsK1KEnIkjx-nw/exec', {
      method: 'POST',
      body: JSON.stringify(formData),
      headers: {'Content-Type': 'application/json'}
    });

    const result = await response.json();
    if (result.result === 'success') {
      document.getElementById('message').textContent = '已經完成';
      document.getElementById('readingForm').reset();
    } else {
      document.getElementById('message').textContent = '儲存失敗，請重試';
    }
  } catch (error) {
    document.getElementById('message').textContent = '發生錯誤，請重試';
  }
  document.getElementById('submitBtn').disabled = false;
};
</script>
</body>
</html>
