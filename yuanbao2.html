<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元保宮遶境地圖（精緻固定版）</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        body { margin:0; font-family:sans-serif; }
        #map { height:100vh; }
        
        #title {
            position:absolute;
            top:10px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(255,255,255,0.9);
            padding:6px 12px;
            border-radius:8px;
            font-size: 14px;
            font-weight:bold;
            box-shadow:0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
        }

        /* 右下角縮小版控制面板 */
        #controls {
            position: absolute;
            bottom: 10px; /* 移到下方 */
            right: 10px;  /* 移到右方 */
            background: rgba(255, 255, 255, 0.85); /* 增加透明度 */
            padding: 6px 10px;
            border-radius: 6px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.2);
            z-index: 1000;
            width: 125px; /* 限制寬度 */
            font-size: 11px; /* 縮小字體 */
        }
        #controls h4 { 
            margin: 0 0 4px 0; 
            font-size: 12px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 3px; 
        }
        .route-item { 
            margin-bottom: 2px; 
            display: flex; 
            align-items: center; 
            line-height: 1.2;
        }
        .route-item input { 
            margin-right: 4px; 
            cursor: pointer; 
            width: 12px; 
            height: 12px; /* 縮小勾選框 */
        }
        .route-item label { cursor: pointer; }
        #hint { font-size: 9px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="title">準備開始...</div>

<div id="controls">
    <h4>播放路線</h4>
    <div id="routeList"></div>
    <div id="hint">* 未勾選則預設全選</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

const map = L.map('map').setView([24.16, 120.68], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(map);

const routeListDiv = document.getElementById('routeList');
allRoutesData.forEach((r, index) => {
    const item = document.createElement('div');
    item.className = 'route-item';
    item.innerHTML = `<input type="checkbox" id="route_${index}" value="${index}">
                      <label for="route_${index}" style="color:${r.color}; font-weight:bold;">${r.name}</label>`;
    routeListDiv.appendChild(item);
});

let currentQueue = [];
let queueIndex = 0;
let stepIndex = 0;
let allMarkers = [];
let allPolylines = [];
let timer = null;

function startPlayback() {
    const checkedBoxes = document.querySelectorAll('#routeList input:checked');
    let selectedIndexes = Array.from(checkedBoxes).map(cb => parseInt(cb.value));
    
    if (selectedIndexes.length === 0) {
        selectedIndexes = allRoutesData.map((_, i) => i);
    }
    
    currentQueue = selectedIndexes.map(i => allRoutesData[i]);
    queueIndex = 0;

    // 自動縮放到合適範圍
    let bounds = L.latLngBounds([]);
    currentQueue.forEach(route => {
        route.data.forEach(p => bounds.extend([p.lat, p.lng]));
    });
    if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [30, 30] });
    }
    
    playNextRouteInQueue();
}

function playNextRouteInQueue() {
    if (queueIndex >= currentQueue.length) {
        setTimeout(restartAll, 3000);
        return;
    }

    const route = currentQueue[queueIndex];
    document.getElementById("title").innerText = `播放中：${route.name}`;

    // 線條寬度縮小：weight 2 -> 1
    let currentPolyline = L.polyline([], {
        color: route.color,
        weight: 1, 
        opacity: 0.8,
        dashArray: '4, 8'
    }).addTo(map);

    allPolylines.push(currentPolyline);
    stepIndex = 0;

    timer = setInterval(() => {
        if (stepIndex >= route.data.length) {
            clearInterval(timer);
            queueIndex++;
            setTimeout(playNextRouteInQueue, 1500);
            return;
        }

        const p = route.data[stepIndex];
        const marker = L.circleMarker([p.lat, p.lng], {
            radius: 4,
            color: 'white',
            fillColor: route.color,
            fillOpacity: 1,
            weight: 1
        }).addTo(map).bindPopup(p.name);

        allMarkers.push(marker);
        currentPolyline.addLatLng([p.lat, p.lng]);
        stepIndex++;
    }, 800);
}

function restartAll() {
    allMarkers.forEach(m => map.removeLayer(m));
    allMarkers = [];
    allPolylines.forEach(l => map.removeLayer(l));
    allPolylines = [];
    startPlayback();
}

startPlayback();
</script>
</body>
</html>
