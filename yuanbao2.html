// 地圖初始化
const map = L.map('map').setView([24.16, 120.68], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap'
}).addTo(map);

let currentRoutes = []; // 目前輪播的路線陣列
let routeIndex = 0;
let stepIndex = 0;
let allMarkers = [];
let allPolylines = [];
let currentPolyline = null;
let timer = null;

// 生成勾選選單
const checkboxesContainer = document.getElementById("checkboxes");
routes.forEach((route, index) => {
    const label = document.createElement("label");
    label.className = "checkbox-item";
    label.style.borderLeft = `5px solid ${route.color}`;
    label.innerHTML = `
        <input type="checkbox" value="${index}" onchange="updateSelectedRoutes()">
        ${route.name}
    `;
    checkboxesContainer.appendChild(label);
});

// 依據勾選狀態決定輪播路線
function updateSelectedRoutes() {
    const checkedBoxes = document.querySelectorAll("#checkboxes input:checked");
    
    if (checkedBoxes.length > 0) {
        // 如果有勾選，僅播放勾選的路線
        currentRoutes = Array.from(checkedBoxes).map(box => routes[parseInt(box.value)]);
    } else {
        // 沒有勾選，播放全部
        currentRoutes = [...routes];
    }
    
    // 重置並從頭播放
    restartAll();
}

function playRoute() {
    if (currentRoutes.length === 0) return;

    // 確保 routeIndex 不會溢出
    if (routeIndex >= currentRoutes.length) {
        routeIndex = 0;
    }

    const route = currentRoutes[routeIndex];
    document.getElementById("title").innerText = `播放中：${route.name}`;

    currentPolyline = L.polyline([], {
        color: route.color,
        weight: 4,
        dashArray: '5, 10'
    }).addTo(map);

    allPolylines.push(currentPolyline);
    stepIndex = 0;

    timer = setInterval(() => {
        if (stepIndex >= route.data.length) {
            clearInterval(timer);
            routeIndex++;
            
            if (routeIndex >= currentRoutes.length) {
                setTimeout(restartAll, 2000);
            } else {
                setTimeout(playRoute, 1000);
            }
            return;
        }

        const p = route.data[stepIndex];
        const marker = L.circleMarker([p.lat, p.lng], {
            radius: 6,
            color: route.color,
            fillColor: "#fff",
            fillOpacity: 0.8,
            weight: 2
        }).addTo(map).bindPopup(`<b>${route.name}</b><br>${p.name}`);

        allMarkers.push(marker);
        currentPolyline.addLatLng([p.lat, p.lng]);
        map.panTo([p.lat, p.lng]);
        stepIndex++;
    }, 700);
}

function restartAll() {
    // 清除定時器
    if (timer) clearInterval(timer);

    // 移除地圖上的元素
    allMarkers.forEach(m => map.removeLayer(m));
    allMarkers = [];
    allPolylines.forEach(l => map.removeLayer(l));
    allPolylines = [];
    
    // 重置索引
    routeIndex = 0;
    
    setTimeout(playRoute, 500);
}

// 首次載入：預設播放全部路線
currentRoutes = [...routes];
playRoute();
