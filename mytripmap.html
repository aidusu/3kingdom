<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>GPS 地圖標記展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map { height: 75vh; width: 100%; border-radius: 8px; margin-top: 10px; }
    body { font-family: "Noto Sans TC", Arial, sans-serif; padding: 15px; }
    #filterForm { margin-bottom: 1em; }
    input[type="text"] { padding: 8px; font-size: 1rem; width: 150px; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    #statusMsg { color: #666; margin-top: 5px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h2>myTrackIn 1.0 Map</h2>
  <p>歡迎體驗第一代的打卡服務，請輸入旅遊代碼</p>
  <p>例如: 請輸入 L01(班加羅爾); N2409(北歐); K06(金門); J2503(關西賞櫻); T2508(土耳其); B22(關西賞楓); T26(突尼西亞); A25(台灣) </p>
  <form id="filterForm">
    <label for="teamInput">請輸入旅遊行程代碼：</label>
    <input type="text" id="teamInput" placeholder="例如：D53" required>
    <button type="submit">查詢</button>
  </form>
  <div id="statusMsg">資料載入中...</div>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    // 1. 初始化地圖
    const map = L.map('map').setView([23.5, 121], 7); // 台灣中心點

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. 深色顏色池與姓名分配邏輯
    const deepColors = [
      '#8B0000', '#00008B', '#006400', '#4B0082', '#2F4F4F',
      '#800000', '#191970', '#483D8B', '#2E0854', '#0B3D91'
    ];
    const nameColorMap = {};
    function getDeepColorForName(name) {
      if (!name) name = '未知';
      if (!nameColorMap[name]) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash += name.charCodeAt(i);
        }
        nameColorMap[name] = deepColors[hash % deepColors.length];
      }
      return nameColorMap[name];
    }

    // 3. 標記圖層管理
    let markersLayer = L.layerGroup().addTo(map);

    // 4. 載入 GPS 資料
    let allData = [];
    async function loadGPSData() {
      const statusMsg = document.getElementById('statusMsg');
      const url = 'https://opensheet.elk.sh/18Ol8kRgvdd6Do91s17CT-w32ds2n3zdN7cf6bDn9a38/位置記錄';
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('無法取得線上試算表資料');
        allData = await res.json();
        statusMsg.textContent = `✅ 資料載入成功！共 ${allData.length} 筆紀錄，請輸入代號進行查詢。`;
      } catch (e) {
        statusMsg.textContent = '❌ 資料載入失敗，請確認 Google Sheet 是否已「發布到網路」。';
        console.error(e);
      }
    }

    // 5. 篩選並顯示標記
    function showTeamMarkers(teamCode) {
      const statusMsg = document.getElementById('statusMsg');
      markersLayer.clearLayers();

      const searchCode = teamCode.trim().toUpperCase();

      // 兼顧中英文欄位名稱相容性
      const filtered = allData.filter(row => {
        const code = row['teamCode'] || row['團隊編號'] || '';
        return code.toString().trim().toUpperCase() === searchCode;
      });

      if (filtered.length === 0) {
        statusMsg.textContent = `⚠️ 找不到代號「${teamCode}」的定位資料。`;
        return;
      }

      // 依姓名分組，取最新一筆資料
      const latestByName = {};
      filtered.forEach(row => {
        const name = row['name'] || row['姓名'] || '未知成員';
        const time = row['timestamp'] || row['時間'] || '';
        if (!latestByName[name] || time > (latestByName[name]['timestamp'] || latestByName[name]['時間'] || '')) {
          latestByName[name] = row;
        }
      });

      const bounds = [];

      // 繪製地點標記
      Object.values(latestByName).forEach(row => {
        const name = row['name'] || row['姓名'] || '未知成員';
        const lat = parseFloat(row['latitude'] || row['緯度']);
        const lng = parseFloat(row['longitude'] || row['經度']);
        const uuid = row['uuid'] || row['UUID'] || '';
        const time = row['timestamp'] || row['時間'] || '';

        if (isNaN(lat) || isNaN(lng)) return;

        bounds.push([lat, lng]);

        const color = getDeepColorForName(name);
        const marker = L.circleMarker([lat, lng], {
          radius: 10,
          color: color,
          fillColor: color,
          fillOpacity: 0.8
        });
        
        marker.bindPopup(
          `<b>姓名：${name}</b><br>代號：${teamCode}<br>時間：${time}<br><small>UUID: ${uuid}</small>`
        );
        marker.addTo(markersLayer);
      });

      // 自動定位與縮放
      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        statusMsg.textContent = `📌 成功顯示 ${bounds.length} 個標記位置。`;
      }
    }

    // 6. 表單事件監聽
    document.getElementById('filterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const teamCode = document.getElementById('teamInput').value.trim();
      if (!teamCode) return;
      showTeamMarkers(teamCode);
    });

    // 7. 初始化載入資料
    loadGPSData();
  </script>
</body>
</html>
