<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>團隊資料精確查詢系統</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        /* 樣式保持不變，參考之前的程式碼 */
    </style>
</head>
<body>
    <div class="container">
        <h2>團隊資料查詢系統</h2>
        <div class="form-group">
            <input type="text" id="teamId" placeholder="團隊編號" required>
            <input type="text" id="leaderName" placeholder="領隊姓名" required>
            <button onclick="searchData()">立即查詢</button>
        </div>
        <div class="result-box" id="results"></div>
    </div>

<script>
async function searchData() {
    const teamId = document.getElementById('teamId').value.trim();
    const leaderName = document.getElementById('leaderName').value.trim();
    const resultsDiv = document.getElementById('results');

    // 清空先前結果
    resultsDiv.innerHTML = '<div class="loading">查詢中...</div>';

    try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbz-uLpdenmn7G3G_GBaV3Bkm0oYqBfFjQsGBXixPMEJQbWuhidlqTGNxrrilyz63YS6/exec?action=search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 團隊編號: teamId, 領隊姓名: leaderName })
        });

        if (!response.ok) throw new Error(`網路錯誤: ${response.status}`);
        
        const data = await response.json();
        
        if(data.result === 'success') {
            showResults(data.members);
        } else if(data.errorType) {
            handleSpecificError(data.errorType, data.message);
        } else {
            throw new Error(data.message || '未知錯誤');
        }
    } catch (error) {
        resultsDiv.innerHTML = `<div class="error">錯誤: ${error.message}</div>`;
    }
}

function handleSpecificError(errorType, message) {
    const resultsDiv = document.getElementById('results');
    let errorHTML = '';
    
    switch(errorType) {
        case 'TEAM_NOT_FOUND':
            errorHTML = `<div class="error">❌ 查無此團隊編號: ${message}</div>`;
            break;
        case 'LEADER_NOT_MATCH':
            errorHTML = `<div class="error">❌ 查無此領隊姓名: ${message}</div>`;
            break;
        default:
            errorHTML = `<div class="error">錯誤: ${message}</div>`;
    }
    
    resultsDiv.innerHTML = errorHTML;
}

function showResults(members) {
    const resultsDiv = document.getElementById('results');
    
    if(members.length === 0) {
        resultsDiv.innerHTML = '<div class="info">⚠️ 查無任何成員資料</div>';
        return;
    }

    // 顯示結果的HTML結構（參考之前的程式碼）
}
</script>
</body>
</html>
