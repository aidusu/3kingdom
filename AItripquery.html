<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>團隊資料查詢</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: "微軟正黑體", sans-serif; max-width: 400px; margin: 3em auto; }
        input, button { width: 100%; padding: 1em; margin: 0.5em 0; font-size: 1em; }
        button { background: #4CAF50; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>團隊資料查詢</h2>
    <form id="searchForm" action="https://script.google.com/macros/s/AKfycbzOjCOpzbzAjvHWXd_bNAqZoGgWKhiYTJfd2mkP7Ga8ySKYcaAziGEIV-V-COvuOrV6TQ/exec" method="GET" target="_blank">
        <input type="text" name="teamId" placeholder="請輸入團隊編號" required>
        <input type="text" name="leaderName" placeholder="請輸入領隊姓名" required>
        <button type="submit">查詢</button>
    </form>
</body>
</html>
