<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>團隊成員查詢系統</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        body {
            font-family: "Segoe UI", "Arial", "微軟正黑體", sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f6fa;
        }
        .container {
            max-width: 420px;
            margin: 20px auto;
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 24px;
        }
        .search-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #3498db;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #2980b9;
        }
        #results {
            margin-top: 20px;
        }
        .member-item {
            padding: 10px;
            margin: 10px 0;
            background: #ecf0f1;
            border-radius: 6px;
        }
        .error {
            color: #e74c3c;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>領隊查詢成員名單</h2>
       <p>領隊輸入團隊編號與領隊姓名可以查詢成員名單</p>
        <form id="searchForm" class="search-form">
            <input type="text" id="teamId" name="團隊編號" placeholder="請輸入團隊編號" required>
            <input type="text" id="leaderName" name="領隊姓名" placeholder="請輸入領隊姓名" required>
            <button type="submit">立即查詢</button>
        </form>
        <div id="results"></div>
    </div>

    <script>
        document.getElementById('searchForm').onsubmit = async function(e) {
            e.preventDefault();
            
            const formData = {
                '團隊編號': document.getElementById('teamId').value,
                '領隊姓名': document.getElementById('leaderName').value
            };

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbwYxKklszAYNv56sQFV-OP5LIr4fMCvamMY9mIFFWtqNEqjT6LBdcwUArimNfghMNUsKg/exec', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if(data.result === 'success') {
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `
                        <h3>查詢結果 (共 ${data.members.length} 人)</h3>
                        ${data.members.map(member => `
                            <div class="member-item">
                                <p>會員編號: ${member.會員編號}</p>
                                <p>註冊時間: ${member.時間}</p>
                            </div>
                        `).join('')}
                    `;
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                document.getElementById('results').innerHTML = `
                    <div class="error">錯誤: ${error.message}</div>
                `;
            }
        };
    </script>
</body>
</html>
