<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>土耳其之旅 2025</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+TC:wght@300;400;500&display=swap');

:root{
  --bg:#f5f1e8;
  --panel:#ffffff;
  --border:#d8d2c7;
  --gold:#c28b2c;
  --gold2:#e6b85c;
  --text:#2b2b2b;
  --muted:#7b7b7b;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html, body {
  height: 100%;
  width: 100%;
  overflow: hidden; 
}

body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
}

#header{
  flex-shrink: 0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 15px;
  background:rgba(255,255,255,0.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
  z-index:1001;
}

#header-title{
  font-family:'Playfair Display',serif;
  font-size:18px;
  color:var(--gold);
  white-space: nowrap;
}

#header-sub{
  font-size:10px;
  color:var(--muted);
}

#prog-track{
  flex:1;
  height:4px;
  background:#ece7de;
  border-radius:999px;
  overflow:hidden;
  margin: 0 5px;
}

#prog-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--gold), var(--gold2));
  transition:width .2s ease;
}

#status-chip{
  font-size:11px;
  color:var(--gold);
  background:#fff6e8;
  border:1px solid #ecd3a2;
  padding:4px 10px;
  border-radius:999px;
  white-space: nowrap;
}

.ctrl-btn{
  background:#fff;
  border:1px solid #d6d0c4;
  color:#333;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  white-space: nowrap;
}

#map{
  flex:1;
  width: 100%;
  min-height: 0; 
  background: #eee;
  z-index: 1;
}

#bottom-panel{
  flex-shrink: 0;
  background:rgba(255,255,255,0.95);
  border-top:1px solid var(--border);
  padding:12px;
  overflow-x:auto;
  backdrop-filter:blur(10px);
  z-index: 1001;
  -webkit-overflow-scrolling: touch;
}

#day-legend{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:max-content;
}

#day-legend h4{
  font-size:11px;
  color:var(--muted);
  text-transform: uppercase;
  margin-right:5px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:999px;
  background:#faf7f2;
  border:1px solid #ece6dc;
  transition: all 0.3s ease;
}

.legend-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.legend-label{
  font-size:11px;
  color:#444;
}

.legend-label.muted{
  opacity:.3;
}

@media (max-width:768px){
  #header{ padding: 8px 12px; gap: 8px; }
  #header-title { font-size: 16px; }
  .ctrl-btn { padding: 5px 8px; font-size: 11px; }
  #status-chip { display: none; } 
}
</style>
</head>

<body>

<div id="header">
  <div>
    <div id="header-title">🕌 Turkey 2025</div>
    <div id="header-sub">Jul 31 – Aug 11</div>
  </div>

  <div id="prog-track">
    <div id="prog-fill"></div>
  </div>

  <div id="status-chip">準備中...</div>

  <select id="speed-sel" class="ctrl-btn">
    <option value="2">快</option>
    <option value="1" selected>超快</option>
    <option value="3">正常</option>
  </select>

  <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">⏸ 暫停</button>
  <button class="ctrl-btn" onclick="restartAll()">↺ 重播</button>
</div>

<div id="map"></div>

<div id="bottom-panel">
  <div id="day-legend">
    <h4>每日路線</h4>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  {"Date": "2025-08-10", "Location": "往機場高速公路", "Latitude": 41.059001, "Longitude": 28.957115},
  {"Date": "2025-08-11", "Location": "登機回台灣", "Latitude": 41.256811, "Longitude": 28.735222}

/* ── 顏色與設定 ── */
const DAY_COLORS = {
  '2025-07-31': 'blue', 
  '2025-08-01': '#ef4444', 
  '2025-08-02': '#18181b', 
  '2025-08-03': '#18181b',
  '2025-08-04': '#18181b', 
  '2025-08-05': 'red',
  '2025-08-06': 'blue',
  '2025-08-07': 'red',
  '2025-08-08': 'blue',
  '2025-08-09': 'black',
  '2025-08-10': 'black',
  '2025-08-11': 'red',
};

const DAY_LABELS = {
  '2025-07-31': '7/31 伊斯坦堡→番紅花城',
  '2025-08-01': '8/01 番紅花→安卡拉→卡帕',
  '2025-08-02': '8/02 卡帕多其亞探索',
  '2025-08-03': '8/03 熱氣球升空',
  '2025-08-04': '8/04 卡帕→孔亞',
  '2025-08-05': '8/05 孔亞→安塔利亞',
  '2025-08-06': '8/06 安塔利亞→棉堡',
  '2025-08-07': '8/07 棉堡→以弗所→庫薩達斯',
  '2025-08-08': '8/08 庫薩達斯→伊斯坦堡',
  '2025-08-09': '8/09 伊斯坦堡古城',
  '2025-08-10': '8/10 遊船→托普卡匹→回國',
  '2025-08-11': '8/11 登機',
};

/* ── 初始化地圖 ── */
const map = L.map('map', {
  zoomControl: false,
  tap: false 
}).setView([39, 32], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OSM',
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

/* 建立每日路線 Legend */
const legendEl = document.getElementById('day-legend');
Object.entries(DAY_LABELS).forEach(([date, label]) => {
  const row = document.createElement('div');
  row.className = 'legend-row';
  row.id = 'leg-' + date;
  row.innerHTML = `
    <div class="legend-dot" style="background:${DAY_COLORS[date]}"></div>
    <span class="legend-label muted">${label}</span>
  `;
  legendEl.appendChild(row);
});

/* ── 核心功能 ── */
const roadCache = {};

async function getRoadCoords(a, b) {
  const key = `${a.Latitude},${a.Longitude}|${b.Latitude},${b.Longitude}`;
  if (roadCache[key]) return roadCache[key];

  // 判斷兩點距離，大於 3.0 (約300多公里無中繼點) 代表是搭國內飛機，才畫直線
  const dist = Math.hypot(a.Latitude - b.Latitude, a.Longitude - b.Longitude);
  if (dist > 3.0 || dist < 0.0001) {
    return [[a.Latitude, a.Longitude], [b.Latitude, b.Longitude]];
  }

  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${a.Longitude},${a.Latitude};${b.Longitude},${b.Latitude}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const json = await res.json();
    const coords = json.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
    roadCache[key] = coords;
    return coords;
  } catch {
    // API 失敗時備案：直線
    return [[a.Latitude, a.Longitude], [b.Latitude, b.Longitude]];
  }
}

let timer = null, allMarkers = [], allPolylines = [], playing = false, paused = false;

function setStatus(t) { document.getElementById('status-chip').textContent = t; }
function setProgress(p) { document.getElementById('prog-fill').style.width = Math.min(p, 100) + '%'; }

function addMarker(pt, color, idx) {
  const isFirst = idx === 0, isLast = idx === RAW.length - 1;
  const marker = L.circleMarker([pt.Latitude, pt.Longitude], {
    radius: (isFirst || isLast) ? 6 : 3,
    color: '#ffffff',
    weight: 1.5,
    fillColor: color,
    fillOpacity: 1,
    zIndexOffset: (isFirst || isLast) ? 1000 : 0
  }).bindTooltip(pt.Location, { direction: 'top', offset: [0, -5] }).addTo(map);
  allMarkers.push(marker);
}

function animateSegment(polyline, coords) {
  return new Promise(resolve => {
    let idx = 0;
    // 取得當前的速度選項
    const speedSetting = parseInt(document.getElementById('speed-sel').value);
    
    // 改進動畫邏輯：透過調整「每次畫面更新要畫幾個點」來達到真正加速，而不是改變延遲時間
    const pointsPerTick = speedSetting === 1 ? 12 : (speedSetting === 2 ? 6 : 2);
    
    // 固定 20ms 更新一次畫面 (約 50fps)
    timer = setInterval(() => {
      if (!playing) { clearInterval(timer); resolve(); return; }
      if (paused) return;
      
      for(let step = 0; step < pointsPerTick; step++) {
        if (idx >= coords.length) { 
          clearInterval(timer); 
          resolve(); 
          return; 
        }
        polyline.addLatLng(coords[idx++]);
      }
    }, 20); 
  });
}

function clearAll() {
  if (timer) clearInterval(timer);
  allMarkers.forEach(m => map.removeLayer(m));
  allPolylines.forEach(l => map.removeLayer(l));
  allMarkers = []; allPolylines = []; playing = false; paused = false;
  Object.keys(DAY_LABELS).forEach(d => {
    const el = document.getElementById('leg-' + d);
    if (el) el.querySelector('.legend-label').className = 'legend-label muted';
  });
}

async function startPlayback() {
  clearAll();
  playing = true;

  map.invalidateSize();
  const bounds = L.latLngBounds(RAW.map(p => [p.Latitude, p.Longitude]));
  map.fitBounds(bounds, { padding: [30, 30] });

  let currentDay = null, polyline = null;

  for (let i = 0; i < RAW.length; i++) {
    if (!playing) return;
    const pt = RAW[i];
    const color = DAY_COLORS[pt.Date] || '#d97706';

    if (pt.Date !== currentDay) {
      currentDay = pt.Date;
      polyline = L.polyline([], { color, weight: 2.5, opacity: 0.8 }).addTo(map);
      allPolylines.push(polyline);

      const legEl = document.getElementById('leg-' + pt.Date);
      if (legEl) {
        legEl.querySelector('.legend-label').className = 'legend-label';
        legEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
      setStatus(DAY_LABELS[pt.Date] || pt.Date);
    }

    addMarker(pt, color, i);
    setProgress((i / (RAW.length - 1)) * 100);

    if (i < RAW.length - 1) {
      const coords = await getRoadCoords(pt, RAW[i + 1]);
      await animateSegment(polyline, coords);
    }
  }
  setStatus('旅程結束 ✈️');
  setProgress(100);
}

function restartAll() {
  document.getElementById('pause-btn').textContent = '⏸ 暫停';
  startPlayback();
}

function togglePause() {
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? '▶ 繼續' : '⏸ 暫停';
}

window.addEventListener('resize', () => map.invalidateSize());

window.onload = () => {
  setTimeout(startPlayback, 500);
};

</script>
