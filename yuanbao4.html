<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元保宮遶境地圖（道路版）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    background: #111;
  }
  #map { flex: 1; position: relative; }
 
  #title {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 1000;
    white-space: nowrap;
  }
 
  #controls {
    background: #fff;
    padding: 7px 12px 9px;
    border-top: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
  }
  #controls-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  #routeList {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 14px;
  }
  .route-item { display: flex; align-items: center; gap: 3px; }
  .route-item label { cursor: pointer; font-weight: 600; font-size: 11.5px; }
 
  #replay-btn {
    background: #e8530a;
    border: none;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    padding: 4px 11px;
    border-radius: 4px;
    cursor: pointer;
  }
  #replay-btn:hover { background: #c44008; }
 
  #prog-wrap {
    flex: 1;
    height: 4px;
    background: #e0e0e0;
    border-radius: 2px;
    overflow: hidden;
    min-width: 60px;
  }
  #prog-bar {
    height: 100%;
    background: linear-gradient(90deg, #e8530a, #fbbf24);
    width: 0%;
    transition: width 0.3s;
  }
 
  #status {
    font-size: 10.5px;
    color: #888;
    white-space: nowrap;
  }
</style>
</head>
<body>
 
<div id="map">
  <div id="title">載入中…</div>
</div>
 
<div id="controls">
  <div id="controls-top">
    <strong>遶境路線</strong>
    <div id="prog-wrap"><div id="prog-bar"></div></div>
    <span id="status"></span>
    <button id="replay-btn" onclick="restartAll()">↺ 重播</button>
    <span style="color:#aaa">勾選篩選：</span>
  </div>
  <div id="routeList"></div>
</div>
 
<!-- Leaflet JS 在頁面結構之後、所有自訂 JS 之前載入 -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
/* ── 資料 ── */
const allRoutesData = [
  { name:"4/26 後龍仔1", color:"#3b82f6", data:[{name:"元保宮",lat:24.16306,lng:120.67630},{name:"賴厝福德祠",lat:24.1672,lng:120.6765},{name:"萬春宮",lat:24.1436,lng:120.6843},{name:"澄清醫院",lat:24.1575,lng:120.6639},{name:"南天宮",lat:24.1493,lng:120.6849},{name:"樂成宮",lat:24.1375,lng:120.6933},{name:"萬和宮",lat:24.1340,lng:120.6465},{name:"田心福德廟",lat:24.13874,lng:120.64259},{name:"老虎城",lat:24.1633,lng:120.6402},{name:"新光三越",lat:24.1649,lng:120.6430},{name:"均安宮",lat:24.14876,lng:120.67115}] },
  { name:"4/26 後龍仔2", color:"black", data:[{name:"元保宮",lat:24.16306,lng:120.67630},{name:"北台中城隍廟",lat:24.14873,lng:120.68131},{name:"朝奉宮",lat:24.15045,lng:120.67408},{name:"民龍里土地公",lat:24.15445,lng:120.67070},{name:"雙龍里",lat:24.14682,lng:120.68541},{name:"均安宮",lat:24.14876,lng:120.67115},{name:"大墩文化中心",lat:24.14182,lng:120.66595},{name:"土庫吉籠福德祠",lat:24.13869,lng:120.66120},{name:"奉順宮",lat:24.13304,lng:120.66637}] },
  { name:"4/26 後龍仔3", color:"#ef4444", data:[{name:"元保宮",lat:24.16306,lng:120.67630},{name:"景聖宮",lat:24.15017,lng:120.67683},{name:"中政福德祠",lat:24.14716,lng:120.68189},{name:"光音福德祠",lat:24.14620,lng:120.67896},{name:"保安宮",lat:24.15008,lng:120.67714},{name:"竹圍福德宮",lat:24.15544,lng:120.67615},{name:"水仙宮",lat:24.14791,lng:120.67712},{name:"太子宮",lat:24.14577,lng:120.67286},{name:"輔順將軍廟",lat:24.1475,lng:120.6822}] },
  { name:"4/27 麻園頭", color:"#a855f7", data:[{name:"均安宮",lat:24.14876,lng:120.67115},{name:"中興福德祠",lat:24.15121,lng:120.66255},{name:"公正福德祠",lat:24.15007,lng:120.65933},{name:"昇平福德祠",lat:24.14640,lng:120.66285},{name:"東興福德廟",lat:24.14521,lng:120.65098},{name:"萬壽棒球場",lat:24.14722,lng:120.65061},{name:"長春堂",lat:24.15559,lng:120.66118},{name:"麻園頭福德祠",lat:24.15484,lng:120.66063},{name:"忠誠里福德祠",lat:24.16165,lng:120.66260},{name:"應天宮",lat:24.15689,lng:120.66471},{name:"興農宮",lat:24.15419,lng:120.66211}] },
  { name:"4/28 邱厝仔", color:"#b45309", data:[{name:"漢口路崇德路口",lat:24.167113,lng:120.685062},{name:"邱厝里福德祠",lat:24.15965,lng:120.68562},{name:"台中聖賢堂",lat:24.16013,lng:120.68355},{name:"中國醫大立夫大樓",lat:24.15804,lng:120.68033},{name:"仙鴻宮",lat:24.15577,lng:120.68080},{name:"福安境福德祠",lat:24.15577,lng:120.68080},{name:"中山堂",lat:24.15622,lng:120.68261},{name:"福全境福德祠",lat:24.15136,lng:120.67969},{name:"中友百貨",lat:24.15243,lng:120.68473},{name:"一中街水利大樓",lat:24.14920,lng:120.68565},{name:"北台中城隍廟",lat:24.14897,lng:120.68161}] },
  { name:"4/29 三十張犁", color:"#0ea5e9", data:[{name:"三川福德祠",lat:24.16533,lng:120.70297},{name:"建成里",lat:24.15925,lng:120.70094},{name:"建德里",lat:24.16023,lng:120.69727},{name:"尾張仔福德廟",lat:24.15799,lng:120.69615},{name:"三聖宮",lat:24.16066,lng:120.68772},{name:"北屯福德祠",lat:24.16551,lng:120.69349},{name:"水仙宮",lat:24.16673,lng:120.69357},{name:"九龍宮",lat:24.16699,lng:120.69598},{name:"水井福隆宮",lat:24.16845,lng:120.71313},{name:"舊社福德祠",lat:24.18229,lng:120.70177},{name:"南興宮",lat:24.18202,lng:120.70600},{name:"福順宮",lat:24.17956,lng:120.72384},{name:"和平里",lat:24.17856,lng:120.72338},{name:"軍福宮",lat:24.17673,lng:120.72064}] },
  { name:"4/30 二分埔", color:"#7c3aed", data:[{name:"柳陽西街遼寧路",lat:24.1754,lng:120.6784},{name:"平興里福德祠",lat:24.17876,lng:120.69651},{name:"廣天宮",lat:24.17252,lng:120.69542},{name:"田都府",lat:24.1780,lng:120.6810},{name:"台中竹安宮",lat:24.16795,lng:120.6795},{name:"梅川福德宮",lat:24.17566,lng:120.67998},{name:"水湳福德宮",lat:24.17788,lng:120.67606},{name:"水湳媽祖廟",lat:24.17672,lng:120.67060},{name:"新平陳平里",lat:24.18770,lng:120.66048},{name:"大陳平福德祠",lat:24.18301,lng:120.66701},{name:"紫微宮",lat:24.18317,lng:120.66663}] },
  { name:"5/1 賴厝1", color:"#059669", data:[{name:"元保宮",lat:24.16306,lng:120.67630},{name:"光大國宅",lat:24.1665,lng:120.6715},{name:"中達福均宮",lat:24.1678,lng:120.6698},{name:"淡溝福德祠",lat:24.1687,lng:120.6685},{name:"慧德宮",lat:24.1654,lng:120.6655},{name:"賴厝廓福德祠",lat:24.1630,lng:120.6700},{name:"回駕元保宮",lat:24.16306,lng:120.67630}] },
  { name:"5/1 賴厝2", color:"#dc2626", data:[{name:"元保宮",lat:24.16306,lng:120.67630},{name:"明德宮",lat:24.1738,lng:120.6710},{name:"立人派出所",lat:24.1715,lng:120.6725},{name:"明川福德廟",lat:24.1720,lng:120.6750},{name:"永興福德祠",lat:24.1705,lng:120.6755},{name:"台中玄武宮",lat:24.1729,lng:120.6738},{name:"泉興福德祠",lat:24.1690,lng:120.6720},{name:"回駕元保宮",lat:24.16306,lng:120.67630}] }
];
 
/* ── 地圖初始化（Leaflet 已載入） ── */
const map = L.map('map').setView([24.16, 120.68], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);
 
/* ── 勾選框 ── */
const routeListDiv = document.getElementById('routeList');
allRoutesData.forEach((r, i) => {
  const d = document.createElement('div');
  d.className = 'route-item';
  d.innerHTML = `<input type="checkbox" id="r${i}" value="${i}">
    <label for="r${i}" style="color:${r.color}">${r.name}</label>`;
  routeListDiv.appendChild(d);
});
 
/* ── OSRM 道路查詢（含快取 & fallback） ── */
const roadCache = {};
 
async function getRoadCoords(a, b) {
  const key = `${a.lat},${a.lng}|${b.lat},${b.lng}`;
  if (roadCache[key]) return roadCache[key];
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.code !== 'Ok' || !json.routes?.length) throw new Error('no route');
    const coords = json.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
    roadCache[key] = coords;
    return coords;
  } catch (e) {
    console.warn('OSRM fallback:', a.name, '->', b.name, e.message);
    return [[a.lat, a.lng], [b.lat, b.lng]];
  }
}
 
/* ── 播放狀態（先宣告，再使用） ── */
let timer = null;
let allMarkers = [];
let allPolylines = [];
let playing = false;
 
/* ── 工具 ── */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const setTitle  = t => document.getElementById('title').textContent = t;
const setStatus = t => document.getElementById('status').textContent = t;
const setProgress = p => document.getElementById('prog-bar').style.width = p + '%';
 
function clearAll() {
  if (timer) { clearInterval(timer); timer = null; }
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];
  allPolylines.forEach(l => map.removeLayer(l));
  allPolylines = [];
  playing = false;
}
 
function addMarker(p, color) {
  const m = L.circleMarker([p.lat, p.lng], {
    radius: 5, color: '#fff', fillColor: color, fillOpacity: 1, weight: 2
  }).addTo(map).bindPopup(`<b>${p.name}</b>`);
  allMarkers.push(m);
}
 
/* 動畫繪製一段道路座標 */
function animateSegment(polyline, coords) {
  return new Promise(resolve => {
    let idx = 0;
    timer = setInterval(() => {
      if (!playing || idx >= coords.length) {
        clearInterval(timer);
        timer = null;
        resolve();
        return;
      }
      polyline.addLatLng(coords[idx++]);
    }, 20); // 20ms per point；調大可減慢
  });
}
 
/* 播放一條路線：邊查詢邊繪製，無需等全部計算完 */
async function playRoute(routeIdx, queuePos, queueTotal) {
  const r = allRoutesData[routeIdx];
  setTitle('🎏 播放中：' + r.name);
  setProgress((queuePos / queueTotal) * 100);
 
  const polyline = L.polyline([], {
    color: r.color, weight: 3.5, opacity: 0.88,
    lineJoin: 'round', lineCap: 'round'
  }).addTo(map);
  allPolylines.push(polyline);
 
  addMarker(r.data[0], r.color);
 
  for (let i = 0; i < r.data.length - 1; i++) {
    if (!playing) return;
    setStatus(`路段 ${i + 1}/${r.data.length - 1} 查詢中…`);
    const coords = await getRoadCoords(r.data[i], r.data[i + 1]);
    setStatus('');
    if (!playing) return;
    await animateSegment(polyline, coords);
    if (!playing) return;
    addMarker(r.data[i + 1], r.color);
  }
}
 
/* 主播放佇列 */
async function startPlayback() {
  clearAll();
  playing = true;
 
  const checked = document.querySelectorAll('#routeList input:checked');
  const selected = checked.length === 0
    ? allRoutesData.map((_, i) => i)
    : Array.from(checked).map(cb => parseInt(cb.value));
 
  const bounds = L.latLngBounds([]);
  selected.forEach(i => allRoutesData[i].data.forEach(p => bounds.extend([p.lat, p.lng])));
  if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
 
  setProgress(0);
 
  for (let qi = 0; qi < selected.length; qi++) {
    if (!playing) return;
    await playRoute(selected[qi], qi, selected.length);
    if (!playing) return;
    await sleep(1200);
  }
 
  setTitle('🎏 全部播放完畢，5 秒後重播…');
  setStatus('');
  setProgress(100);
  await sleep(5000);
  if (playing) startPlayback();
}
 
function restartAll() {
  clearAll();
  startPlayback();
}
 
/* ── 啟動 ── */
startPlayback();
</script>
</body>
</html>
