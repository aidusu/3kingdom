<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>義大利經典之旅</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* 拍立得照片標記樣式 */
        .polaroid-wrapper {
            background-color: white;
            padding: 5px 5px 15px 5px; /* 底部留白產生拍立得效果 */
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border-radius: 2px;
            width: 60px;
            height: 70px;
            transition: transform 0.3s ease;
        }
        .polaroid-wrapper:hover {
            transform: scale(1.4) rotate(-5deg);
            z-index: 999 !important;
        }
        .polaroid-wrapper img {
            width: 100%;
            height: 50px;
            object-fit: cover;
            display: block;
            background-color: #eee;
        }

        /* 汽車 emoji 標記樣式 */
        .car-emoji {
            font-size: 28px;
            text-align: center;
            line-height: 28px;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.5));
            margin-top: -14px;
            margin-left: -14px;
        }

        /* 自訂資訊面版捲軸隱藏 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
    </style>
</head>
<body class="bg-gray-100">

    <div id="map"></div>

    <!-- 半透明縮小版資訊方塊 -->
    <div class="absolute top-4 left-4 z-[1000] w-64 bg-white/70 backdrop-blur-md border border-white/40 shadow-lg rounded-xl p-4 max-h-[90vh] overflow-y-auto no-scrollbar">
        <h1 class="text-xl font-bold text-gray-900 mb-1">義大利經典之旅</h1>
        <p class="text-xs text-gray-700 mb-4 font-semibold">從古羅馬遺跡到浪漫水都。</p>
        
        <div class="relative pl-2 mb-5">
            <!-- 垂直時間軸線 -->
            <div class="absolute w-[2px] bg-gray-400/50 left-[15px] top-2 bottom-2 z-0"></div>
            
            <ul id="itinerary-list" class="space-y-3">
                <!-- 景點項目將由 JavaScript 動態生成 -->
            </ul>
        </div>

        <button id="startAnimationBtn" class="w-full bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-2.5 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center gap-2">
            ▶️ 開始旅程
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        // 景點資料定義 (包含明確的圖片與座標)
        const locations = [
            { id: 1, name: "羅馬競技場", lat: 41.8902, lng: 12.4922, desc: "見證古羅馬輝煌", img: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=150&h=150&fit=crop" },
            { id: 2, name: "西也納", lat: 43.3186, lng: 11.3306, desc: "中世紀古老廣場", img: "https://images.unsplash.com/photo-1604085448655-b46187b500de?w=150&h=150&fit=crop" },
            { id: 3, name: "翡冷翠百花大教堂", lat: 43.7731, lng: 11.2560, desc: "文藝復興圓頂", img: "https://images.unsplash.com/photo-1543429776-27826ac18839?w=150&h=150&fit=crop" },
            { id: 4, name: "米蘭大教堂", lat: 45.4641, lng: 9.1919, desc: "哥德式建築工藝", img: "https://images.unsplash.com/photo-1534015673024-e6df599f57eb?w=150&h=150&fit=crop" },
            { id: 5, name: "多洛米堤", lat: 46.5405, lng: 11.8064, desc: "阿爾卑斯山脈", img: "https://images.unsplash.com/photo-1532427845348-735a22538166?w=150&h=150&fit=crop" },
            { id: 6, name: "威尼斯大教堂", lat: 45.4346, lng: 12.3397, desc: "浪漫水都句點", img: "https://images.unsplash.com/photo-1516483638261-f4088921ecbb?w=150&h=150&fit=crop" }
        ];

        // 初始化地圖，隱藏預設的縮放控制以便移動位置
        const map = L.map('map', { zoomControl: false }).setView([43.8, 11.5], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 使用 Esri World Street Map (無需 API Key，穩定可靠)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        const itineraryContainer = document.getElementById('itinerary-list');

        locations.forEach((loc, index) => {
            // 生成側邊欄項目
            const li = document.createElement('li');
            li.className = "flex items-start relative z-10";
            li.innerHTML = `
                <div class="flex-shrink-0 w-6 h-6 rounded-full bg-red-100 border-2 border-red-500 flex items-center justify-center mt-0.5 bg-white shadow-sm">
                    <span class="text-[11px] font-bold text-red-600">${index + 1}</span>
                </div>
                <div class="ml-2.5">
                    <p class="text-[13px] font-bold text-gray-900 leading-tight">${loc.name}</p>
                    <p class="text-[11px] text-gray-600 mt-0.5">${loc.desc}</p>
                </div>
            `;
            itineraryContainer.appendChild(li);

            // 生成地圖標記 (拍立得風格，確實使用 <img> 標籤)
            const polaroidIcon = L.divIcon({
                className: 'custom-polaroid', // 清除預設背景
                html: `
                    <div class="polaroid-wrapper" title="${loc.name}">
                        <img src="${loc.img}" alt="${loc.name}" loading="lazy" />
                    </div>
                `,
                iconSize: [60, 70],
                iconAnchor: [30, 35]
            });

            L.marker([loc.lat, loc.lng], { icon: polaroidIcon }).addTo(map)
             .bindTooltip(`<span class="font-bold">${loc.name}</span>`, { direction: 'top', offset: [0, -35] });
        });

        let isAnimating = false;
        let animatedLine = null;
        let carMarker = null;

        const carDivIcon = L.divIcon({
            className: 'car-icon-container',
            html: `<div class="car-emoji">🚗</div>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
        });

        // 簡單的線性插值，用於計算兩點之間的座標
        function lerp(start, end, t) {
            return start + (end - start) * t;
        }

        function playAnimation() {
            if (isAnimating) return;
            isAnimating = true;

            const btn = document.getElementById('startAnimationBtn');
            btn.innerHTML = '⏳ 旅途中...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            
            // 清理之前的動畫元件
            if (animatedLine) map.removeLayer(animatedLine);
            if (carMarker) map.removeLayer(carMarker);

            // 建立起點的車輛與路線
            carMarker = L.marker([locations[0].lat, locations[0].lng], { icon: carDivIcon, zIndexOffset: 1000 }).addTo(map);
            animatedLine = L.polyline([ [locations[0].lat, locations[0].lng] ], {
                color: '#dc2626', // Tailwind red-600
                weight: 4,
                opacity: 0.8,
                dashArray: '8, 8'
            }).addTo(map);

            let segmentIndex = 0;
            let progress = 0;
            const animationSpeed = 0.012; // 調整移動速度
            const completedPath = [];

            function animateFrame() {
                if (segmentIndex >= locations.length - 1) {
                    // 動畫結束
                    isAnimating = false;
                    btn.innerHTML = '🔄 重新旅程';
                    btn.classList.remove('opacity-75', 'cursor-not-allowed');
                    animatedLine.setStyle({ dashArray: null }); // 結束後變實線
                    return;
                }

                const startLoc = locations[segmentIndex];
                const endLoc = locations[segmentIndex + 1];

                progress += animationSpeed;

                if (progress >= 1) {
                    // 完成當前路段
                    progress = 0;
                    completedPath.push([startLoc.lat, startLoc.lng]);
                    segmentIndex++;
                    carMarker.setLatLng([startLoc.lat, startLoc.lng]);
                } else {
                    // 移動中
                    // 為了更平滑可以加入 ease in out，這裡使用簡單線性增加流暢度
                    const easeT = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress; 
                    
                    const currentLat = lerp(startLoc.lat, endLoc.lat, easeT);
                    const currentLng = lerp(startLoc.lng, endLoc.lng, easeT);
                    
                    const currentPos = [currentLat, currentLng];
                    carMarker.setLatLng(currentPos);

                    // 更新紅線軌跡
                    animatedLine.setLatLngs([
                        ...completedPath,
                        [startLoc.lat, startLoc.lng],
                        currentPos
                    ]);
                }

                requestAnimationFrame(animateFrame);
            }

            // 確保畫面視野涵蓋所有景點再開始動畫
            map.flyTo([43.8, 11.5], 6, { duration: 1.5 });
            
            setTimeout(() => {
                animateFrame();
            }, 1500);
        }

        // 綁定事件
        document.getElementById('startAnimationBtn').addEventListener('click', playAnimation);
    </script>
</body>
</html>
