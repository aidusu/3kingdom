        :root {
            --green:      #00c853;
            --green-glow: rgba(0,200,83,0.25);

```
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Noto Sans TC', sans-serif;
        background: var(--dark);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 16px;
    }

    /* Subtle grid background */
    body::before {
        content: '';
        position: fixed; inset: 0;
        background-image:
            linear-gradient(rgba(0,200,83,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,200,83,0.03) 1px, transparent 1px);
        background-size: 44px 44px;
        pointer-events: none;
        z-index: 0;
    }

    .card {
        position: relative; z-index: 1;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        width: 100%; max-width: 520px;
        padding: 2.4rem 2rem;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* ── PAGE TOGGLE ── */
    #homePage, #resultPage { display: none; }
    #homePage.active, #resultPage.active { display: block; }

    /* ── HOME PAGE ── */
    .home-logo {
        text-align: center;
        margin-bottom: 2.2rem;
    }
    .home-logo .brand {
        font-family: 'Rajdhani', sans-serif;
        font-size: 2.6rem;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--green);
        text-shadow: 0 0 28px var(--green-glow);
    }
    .home-logo .brand span { color: var(--text); }
    .home-logo .sub {
        font-size: 0.78rem;
        letter-spacing: 3px;
        color: var(--muted);
        text-transform: uppercase;
        margin-top: 4px;
    }

    .page-title {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.5rem;
        letter-spacing: 3px;
        color: var(--muted);
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 2rem;
    }

    .input-group {
        display: flex;
        gap: 10px;
    }
    .input-group input {
        flex: 1;
        padding: 13px 16px;
        background: var(--card2);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
        color: var(--text);
        font-family: 'Noto Sans TC', sans-serif;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input::placeholder { color: var(--muted); }
    .input-group input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(0,200,83,0.15);
    }
    .btn {
        padding: 13px 22px;
        background: var(--green);
        color: #0d1117;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        font-family: 'Noto Sans TC', sans-serif;
        letter-spacing: 1px;
        transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        white-space: nowrap;
    }
    .btn:hover { background: #00e676; box-shadow: 0 0 18px var(--green-glow); }
    .btn:active { transform: scale(0.97); }
    .btn-back {
        background: transparent;
        border: 1.5px solid var(--border);
        color: var(--muted);
        padding: 8px 18px;
        font-size: 13px;
        margin-bottom: 1.6rem;
    }
    .btn-back:hover { border-color: var(--text); color: var(--text); box-shadow: none; }

    /* ── RESULT PAGE ── */
    .result-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 1.4rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border);
    }
    .result-name {
        font-family: 'Rajdhani', sans-serif;
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--green);
    }
    .result-date {
        font-size: 0.82rem;
        color: var(--muted);
        letter-spacing: 1px;
    }

    /* Radar chart */
    .radar-wrap {
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 1.4rem;
    }
    .radar-wrap canvas {
        max-height: 300px;
    }

    /* Info cards */
    .info-block {
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
    }
    .info-label {
        font-size: 0.72rem;
        letter-spacing: 2px;
        color: var(--green);
        text-transform: uppercase;
        margin-bottom: 6px;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
    }
    .info-value {
        font-size: 1rem;
        color: var(--text);
        line-height: 1.65;
    }
    .cluster-badge {
        display: inline-block;
        background: rgba(0,200,83,0.12);
        border: 1px solid rgba(0,200,83,0.35);
        color: var(--green);
        border-radius: 20px;
        padding: 3px 14px;
        font-size: 0.95rem;
        font-weight: 700;
    }

    /* Fade-in animation */
    #resultPage.active {
        animation: fadeUp 0.35s ease both;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 400px) {
        .card { padding: 1.6rem 1.2rem; }
    }
</style>

</div>

<script>
    // ══════════════════════════════════════════════
    //  資料庫：[姓名, 分群, 運動建議, 運動種類, 運動縣市, 跑步等級, 健走等級, 運動次數]
    //  ※ 未來可直接新增列，格式相同
    // ══════════════════════════════════════════════
    const userData = [
        ["Hermann", "運動達人",
         "你已經是運動達人！建議挑戰進階訓練如間歇跑或鐵人三項，並注意均衡訓練不同肌群，搭配適當恢復，避免過度訓練。",
         5, 4, 3, 2, 4],

        ["Mary", "旅遊運動愛好者",
         "旅遊結合運動最棒！建議出遊時安排健行或單車活動，探索當地步道，讓旅行成為健康生活的一部分。",
         2, 5, 2, 3, 3],

        ["Tom", "健走族",
         "健走是最佳的有氧運動！建議逐步增加步行速度與距離，可嘗試增加爬坡路段，搭配手臂擺動增加熱量消耗。",
         1, 3, 2, 5, 4],

        ["John", "跑步愛好者",
         "持續跑步習慣很棒！建議每週安排長跑與間歇訓練，搭配核心肌群強化，注意跑鞋更換週期以保護膝關節。",
         1, 3, 5, 1, 4],

        ["Cindy", "高頻運動者",
         "運動頻率高很棒！建議注意運動多樣性避免重複性傷害，安排適當休息日補充蛋白質，幫助肌肉修復。",
         2, 4, 3, 4, 5]
    ];

    // 雷達圖五個維度標籤
    const radarLabels = ["運動種類", "運動縣市", "跑步等級", "健走等級", "運動次數"];

    let radarChart = null;

    // Enter 鍵支援
    document.getElementById('nameInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') searchUser();
    });

    function searchUser() {
        const name = document.getElementById('nameInput').value.trim();
        const user = userData.find(u => u[0].toLowerCase() === name.toLowerCase());

        if (!user) {
            alert("找不到該用戶！請確認姓名是否正確。");
            return;
        }
        showResult(user);
    }

    function showResult(user) {
        // 姓名與日期
        document.getElementById('displayName').textContent = user[0];
        document.getElementById('displayDate').textContent =
            new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric' });

        // 分群與建議
        document.getElementById('displayCluster').textContent = user[1];
        document.getElementById('displayAdvice').textContent  = user[2];

        // 切換頁面（先切換再畫圖，確保 canvas 可見）
        document.getElementById('homePage').classList.remove('active');
        const resultPage = document.getElementById('resultPage');
        resultPage.classList.add('active');

        // 雷達圖資料 (索引 3-7)
        const radarData = user.slice(3, 8);
        drawRadar(radarData);
    }

    function drawRadar(data) {
        if (radarChart) radarChart.destroy();

        const ctx = document.getElementById('radarChart').getContext('2d');

        radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: radarLabels,
                datasets: [{
                    label: '運動能力指標',
                    data: data,
                    backgroundColor: 'rgba(0,200,83,0.15)',
                    borderColor: '#00c853',
                    borderWidth: 2.5,
                    pointBackgroundColor: '#00c853',
                    pointBorderColor: '#0d1117',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        labels: { color: '#6b7898', font: { size: 12 } }
                    },
                    datalabels: { display: false }  // 雷達圖不顯示標籤
                },
                scales: {
                    r: {
                        min: 0,
                        max: 5,
                        ticks: {
                            stepSize: 1,
                            color: '#6b7898',
                            backdropColor: 'transparent',
                            font: { size: 11 }
                        },
                        grid:        { color: 'rgba(255,255,255,0.07)' },
                        angleLines:  { color: 'rgba(255,255,255,0.07)' },
                        pointLabels: {
                            color: '#dde3f0',
                            font: { size: 13, weight: '500' }
                        }
                    }
                }
            }
        });
    }

    function goHome() {
        document.getElementById('resultPage').classList.remove('active');
        document.getElementById('homePage').classList.add('active');
        document.getElementById('nameInput').value = '';
    }
</script>
