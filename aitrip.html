<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS + UUID 傳送器</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 4vw; 
      margin: 0;
      background: #f8f8f8;
    }
    label, input, button { 
      display: block; 
      margin-top: 4vw; 
      font-size: 1.1rem; 
    }
    input { 
      padding: 1em; 
      width: 100%; 
      box-sizing: border-box;
      max-width: 400px;
    }
    button { 
      padding: 1em; 
      margin-top: 6vw; 
      width: 100%;
      font-size: 1.1rem;
    }
    #output, #error {
      margin-top: 5vw;
      font-size: 1rem;
      word-break: break-all;
      white-space: pre-wrap; /* 讓 \n 換行效果正常顯示 */
    }
    #error {
      color: #d9534f;
    }
    @media (max-width: 600px) {
      body {
        padding: 3vw;
      }
      label, input, button {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <h2>AI Trip 回報位置</h2>
  <label for="teamCode">團隊編號:</label>
  <input type="text" id="teamCode" placeholder="例如：TWM" required />

  <label for="name">成員姓名:</label>
  <input type="text" id="name" placeholder="例如：Hermann" />

  <button onclick="sendGPS()">取得位置並送出</button>

  <div id="output">尚未執行任何動作</div>
  <div id="error"></div>

  <script>
    // 產生或取得裝置唯一識別 UUID
    let uuid = localStorage.getItem("deviceUUID");
    if (!uuid) {
      uuid = crypto.randomUUID();
      localStorage.setItem("deviceUUID", uuid);
    }

    // 將 Date 物件格式化為台北時區 YYYY/MM/DD HH:MM
    function formatTaipeiTime(date) {
      const options = {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      };
      let str = date.toLocaleString('zh-TW', options);
      str = str.replace(/(\d{2}):(\d{2}):\d{2}$/, '$1:$2');
      return str;
    }

    function sendGPS() {
      const output = document.getElementById("output");
      const error = document.getElementById("error");
      const teamCode = document.getElementById("teamCode").value.trim();
      const name = document.getElementById("name").value.trim();

      output.textContent = "正在取得 GPS 位置...";
      error.textContent = "";

      // 驗證必填欄位
      if (!teamCode) {
        error.textContent = "⚠️ 請輸入團隊編號";
        output.textContent = "";
        return;
      }

      if (!navigator.geolocation) {
        error.textContent = "⚠️ 瀏覽器不支援 GPS 定位";
        output.textContent = "";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);
          const now = new Date();
          const taipeiTime = formatTaipeiTime(now);

          const payload = {
            teamCode: teamCode,
            uuid: uuid,
            name: name || "",
            latitude: lat,
            longitude: lon,
            timestamp: taipeiTime,
          };

          output.textContent = `📍 裝置 UUID：${uuid}\n團隊編號：${teamCode}\n姓名：${name || "(未填)"}\n緯度：${lat}\n經度：${lon}\n時間：${taipeiTime}\n\n資料傳送中...`;

          // 修改傳送邏輯
          fetch("https://script.google.com/macros/s/AKfycbx4YIRx1aqB8f-3DXQSF3Jk4xrKsL3yO14-2y_MR0uLHfiJOa4PJsMhG-l2l-fb7rI1/exec", {
            method: "POST",
            // 使用 text/plain 可避免預檢請求 (Preflight CORS)，GAS 仍可透過 e.postData.contents 讀取內容
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
          })
          .then(res => {
            if (res.ok) {
              output.textContent += "\n✅ 資料已送出！";
            } else {
              output.textContent += "\n✅ 資料已送出（請至 Sheet 確認是否寫入）";
            }
          })
          .catch((err) => {
            error.textContent = "❌ 傳送失敗：" + err;
          });
        },
        (err) => {
          error.textContent = "❌ 定位失敗：" + err.message;
          output.textContent = "";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
