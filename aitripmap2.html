<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>GPS 地圖標記展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map { height: 80vh; width: 100%; }
    body { font-family: "Noto Sans TC", Arial, sans-serif; }
    #filterForm { margin-bottom: 1em; }
    #status { margin-left: 10px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <h2>打卡2.0 旅遊地圖</h2>
  <p>用軌跡紀錄，讓旅遊更豐富; </p>
  <p>例如:請輸入 J25(關西秋); K25(關西春); N24(北歐); T25(土耳其); T26(突尼西亞)</p>
  <form id="filterForm">
    <label for="teamInput">請輸入小說代號：</label>
    <input type="text" id="teamInput" required>
    <button type="submit" id="submitBtn">查詢並播放</button>
    <span id="status"></span>
  </form>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    // 1. 初始化地圖
    const map = L.map('map').setView([23.5, 121], 7);

    // 使用無須 API Key 的台灣通用電子地圖
    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: '© 國土測繪圖資服務雲'
    }).addTo(map);

    // 2. 顏色池（每 10 個點循環使用一組顏色）
    const trackColors = [
      '#E63946', // 紅色 (第 1~10 點)
      '#2A9D8F', // 藍綠色 (第 11~20 點)
      '#F4A261', // 暖橙色 (第 21~30 點)
      '#457B9D', // 沉穩藍 (第 31~40 點)
      '#6A4C93', // 紫色 (第 41~50 點)
      '#1D3557', // 深海藍 (第 51~60 點)
      '#D62828', // 暗紅 (第 61~70 點)
      '#028090'  // 青藍 (第 71~80 點)
    ];

    function getSegmentColor(index) {
      // index 從 0 開始，Math.floor(index / 10) 代表每 10 個點為一個分組
      const groupIndex = Math.floor(index / 10);
      return trackColors[groupIndex % trackColors.length];
    }

    // 3. 圖層與計時器管理
    let markersLayer = L.layerGroup().addTo(map);
    let playTimer = null;

    // 4. 載入 GPS 資料
    let allData = [];
    async function loadGPSData() {
      const url = 'https://opensheet.elk.sh/1OLTU06kihkC3XwrphR4asT4-6vdcoKOBxNN94USOlso/位置記錄';
      try {
        const res = await fetch(url);
        allData = await res.json();
      } catch (e) {
        alert('資料載入失敗，請查看 console。');
        console.error(e);
      }
    }

    // 5. 按照全隊時間播放、全隊串連、每 10 點換色
    function playTeamTrack(teamCode) {
      if (playTimer) clearInterval(playTimer);
      markersLayer.clearLayers();

      // 依團隊編號篩選出有效坐標
      const filtered = allData.filter(row => {
        const lat = parseFloat(row['緯度']);
        const lng = parseFloat(row['經度']);
        return row['團隊編號'] === teamCode && !isNaN(lat) && !isNaN(lng);
      });

      if (filtered.length === 0) {
        alert('查無該組別資料！');
        return;
      }

      // 全隊資料直接依照「時間」由先到後嚴格排序
      filtered.sort((a, b) => (String(a['時間']) > String(b['時間']) ? 1 : -1));

      // 縮放到包含所有點的視野
      const allBounds = filtered.map(r => [parseFloat(r['緯度']), parseFloat(r['經度'])]);
      map.fitBounds(allBounds, { padding: [40, 40], maxZoom: 16 });

      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      let lastPoint = null;
      let currentIndex = 0;

      playTimer = setInterval(() => {
        if (currentIndex >= filtered.length) {
          clearInterval(playTimer);
          playTimer = null;
          statusEl.innerText = '（播放完成）';
          submitBtn.disabled = false;
          return;
        }

        const row = filtered[currentIndex];
        const name = row['姓名'] || '成員';
        const lat = parseFloat(row['緯度']);
        const lng = parseFloat(row['經度']);
        const currentPt = [lat, lng];
        
        // 取得當前區間專屬色彩（每 10 個點換一次顏色）
        const currentColor = getSegmentColor(currentIndex);

        statusEl.innerText = `播放中: ${currentIndex + 1} / ${filtered.length} [${row['時間'] || ''}] ${name}`;

        // 畫出細虛線：只要有前一點就直接串連起來（不分人）
        if (lastPoint) {
          L.polyline([lastPoint, currentPt], {
            color: currentColor, // 與目前點顏色一致
            weight: 2,           // 細線
            dashArray: '6, 6',   // 明顯虛線效果
            opacity: 0.9
          }).addTo(markersLayer);
        }

        // 標記該點
        const marker = L.circleMarker(currentPt, {
          radius: 5,
          color: '#ffffff',
          weight: 1.5,
          fillColor: currentColor,
          fillOpacity: 1
        });
        marker.bindPopup(
          `<b>第 ${currentIndex + 1} 點</b><br>` +
          `姓名: ${name}<br>` +
          `時間: ${row['時間'] || ''}<br>` +
          `UUID: ${row['UUID'] || ''}`
        );
        marker.addTo(markersLayer);

        // 更新上一個點
        lastPoint = currentPt;
        currentIndex++;
      }, 300);
    }

    // 6. 表單事件
    document.getElementById('filterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const teamCode = document.getElementById('teamInput').value.trim();
      if (!teamCode) return;
      playTeamTrack(teamCode);
    });

    // 7. 啟動載入
    loadGPSData();
  </script>
</body>
</html>
