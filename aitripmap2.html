<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>GPS 地圖標記展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    #map { height: 80vh; width: 100%; }
    body { font-family: "Noto Sans TC", Arial, sans-serif; }
    #filterForm { margin-bottom: 1em; }
    #status { margin-left: 10px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <h2>旅遊走讀地圖</h2>
  <p>一群朋友出遊; </p>
  <p>例如: 太武山下 請輸入 D53</p>
  <form id="filterForm">
    <label for="teamInput">請輸入小說代號：</label>
    <input type="text" id="teamInput" required>
    <button type="submit" id="submitBtn">查詢並播放</button>
    <span id="status"></span>
  </form>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    // 1. 初始化地圖
    const map = L.map('map').setView([23.5, 121], 7);

    // 使用台灣內政部國土測繪中心 (NLSC) 通用電子地圖，完全免 API Key 且不跳任何授權提示
    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: '© <a href="https://maps.nlsc.gov.tw/" target="_blank">國土測繪圖資服務雲</a>'
    }).addTo(map);

    // 2. 深色顏色池與姓名分配邏輯
    const deepColors = [
      '#8B0000', '#00008B', '#006400', '#4B0082', '#2F4F4F',
      '#800000', '#191970', '#483D8B', '#2E0854', '#0B3D91'
    ];
    const nameColorMap = {};
    function getDeepColorForName(name) {
      if (!nameColorMap[name]) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
          hash += name.charCodeAt(i);
        }
        nameColorMap[name] = deepColors[hash % deepColors.length];
      }
      return nameColorMap[name];
    }

    // 3. 圖層與播放狀態管理
    let markersLayer = L.layerGroup().addTo(map);
    let playTimer = null;

    // 4. 載入 GPS 資料
    let allData = [];
    async function loadGPSData() {
      const url = 'https://opensheet.elk.sh/1OLTU06kihkC3XwrphR4asT4-6vdcoKOBxNN94USOlso/位置記錄';
      try {
        const res = await fetch(url);
        allData = await res.json();
      } catch (e) {
        alert('資料載入失敗，請查看 console。');
        console.error(e);
      }
    }

    // 5. 按照「時間順序」一點一點畫出，並用「細虛線」連接
    function playTeamTrack(teamCode) {
      if (playTimer) clearInterval(playTimer);
      markersLayer.clearLayers();

      // 依團隊編號篩選出有效坐標
      const filtered = allData.filter(row => {
        return row['團隊編號'] === teamCode &&
               !isNaN(parseFloat(row['緯度'])) &&
               !isNaN(parseFloat(row['經度']));
      });

      if (filtered.length === 0) {
        alert('查無該組別資料！');
        return;
      }

      // 依全團「時間」由早到晚排列
      filtered.sort((a, b) => (a['時間'] > b['時間'] ? 1 : -1));

      // 縮放到適當視野
      const allBounds = filtered.map(r => [parseFloat(r['緯度']), parseFloat(r['經度'])]);
      map.fitBounds(allBounds, { padding: [40, 40], maxZoom: 16 });

      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const lastPointByName = {};
      let currentIndex = 0;

      playTimer = setInterval(() => {
        if (currentIndex >= filtered.length) {
          clearInterval(playTimer);
          playTimer = null;
          statusEl.innerText = '（播放完成）';
          submitBtn.disabled = false;
          return;
        }

        const row = filtered[currentIndex];
        const name = row['姓名'] || '成員';
        const lat = parseFloat(row['緯度']);
        const lng = parseFloat(row['經度']);
        const currentPt = [lat, lng];
        const color = getDeepColorForName(name);

        statusEl.innerText = `播放中: ${currentIndex + 1} / ${filtered.length} [${row['時間'] || ''}] ${name}`;

        // 核心改動：改為細虛線 (weight: 1.5, dashArray: '4, 4') 連接前後兩點
        if (lastPointByName[name]) {
          L.polyline([lastPointByName[name], currentPt], {
            color: color,
            weight: 1.5,          // 細線寬度
            dashArray: '4, 4',    // 虛線樣式：線段 4px、間距 4px
            opacity: 0.9
          }).addTo(markersLayer);
        }

        // 標記目前時間點
        const marker = L.circleMarker(currentPt, {
          radius: 5,
          color: color,
          fillColor: color,
          fillOpacity: 0.85
        });
        marker.bindPopup(
          `<b>${name}</b><br>時間: ${row['時間'] || ''}<br>UUID: ${row['UUID'] || ''}`
        );
        marker.addTo(markersLayer);

        // 更新此人的上一位置
        lastPointByName[name] = currentPt;

        currentIndex++;
      }, 300);
    }

    // 6. 表單送出事件
    document.getElementById('filterForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const teamCode = document.getElementById('teamInput').value.trim();
      if (!teamCode) return;
      playTeamTrack(teamCode);
    });

    // 7. 載入遠端資料
    loadGPSData();
  </script>
</body>
</html>
