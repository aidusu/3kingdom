<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAL MAP 2.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
 
        :root {
            --primary:       #1a6b3c;
            --primary-light: #e8f5ee;
            --accent:        #f0a500;
            --danger:        #d9534f;
            --danger-light:  #fbeaea;
            --bg:            #f4f6f4;
            --card:          #ffffff;
            --text:          #1e2b1e;
            --muted:         #6b7c6b;
            --border:        #d4e4d4;
            --radius:        14px;
        }
 
        * { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }
 
        /* ── Header ── */
        header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
        .sub  { font-size: 12px; opacity: .7; margin-top: 2px; }
        #auth-badge {
            margin-left: auto;
            font-size: 11px;
            background: rgba(255,255,255,.18);
            padding: 4px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }
 
        /* ── Tab Nav ── */
        nav {
            display: flex;
            background: var(--card);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
        }
        nav button {
            flex: 1;
            padding: 12px 6px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            color: var(--muted);
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all .2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        nav button .icon { font-size: 20px; }
        nav button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }
        nav button:disabled { opacity: .35; cursor: not-allowed; }
 
        /* ── Pages ── */
        .page { display: none; padding: 20px; max-width: 520px; margin: 0 auto; }
        .page.active { display: block; }
 
        h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
 
        /* ── Forms ── */
        .form-group { margin-bottom: 14px; }
        label {
            display: block; font-size: 12px; font-weight: 600;
            margin-bottom: 5px; color: var(--muted);
            text-transform: uppercase; letter-spacing: .5px;
        }
        input[type=text] {
            display: block; width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px; font-family: inherit;
            background: white; color: var(--text);
            transition: border .15s; outline: none;
        }
        input[type=text]:focus { border-color: var(--primary); }
 
        /* ── Buttons ── */
        .btn {
            display: block; width: 100%;
            padding: 14px; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: all .2s; margin-top: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: #145530; }
        .btn-primary:disabled { background: #aac8b5; cursor: not-allowed; }
        .btn-danger  { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled)  { background: #b02a2a; }
        .btn-danger:disabled { opacity: .5; cursor: not-allowed; }
        .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
        .btn-outline:hover { background: var(--primary-light); }
 
        /* ── Result Boxes ── */
        .result-box {
            padding: 14px 16px; margin-top: 14px;
            border-radius: 10px; font-size: 14px; line-height: 1.7; display: none;
        }
        .result-box.show { display: block; }
        .result-box.success { background: var(--primary-light); border: 1px solid #9ecfb0; color: #0f4a25; }
        .result-box.error   { background: var(--danger-light);  border: 1px solid #f0b8b8; color: #7a1a1a; }
        .result-box.loading { background: #f0f0f0; border: 1px solid #ddd; color: #555; }
        .result-box.warning { background: #fff8e1; border: 1px solid #ffc107; color: #7a5800; }
 
        /* ── Info Card ── */
        .info-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px;
        }
        .info-card .row {
            display: flex; justify-content: space-between;
            font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border);
        }
        .info-card .row:last-child { border: none; }
        .info-card .val { font-weight: 600; color: var(--primary); }
 
        /* ── Leave Banner ── */
        #leave-banner {
            display: none;
            background: #fff3cd; border: 1px solid #ffc107;
            border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
            font-size: 14px; color: #7a5800; line-height: 1.6; text-align: center;
        }
 
        /* ── Map ── */
        #map {
            height: 400px; border-radius: 12px;
            border: 1px solid var(--border); overflow: hidden; margin-top: 14px;
        }
 
        /* ── Map Toolbar ── */
        .map-toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .map-toolbar button {
            flex: 1; min-width: 80px;
            padding: 10px 8px; border: 1.5px solid var(--border);
            border-radius: 8px; background: white;
            font-size: 13px; cursor: pointer; font-family: inherit;
            transition: background .15s;
        }
        .map-toolbar button:hover { background: var(--primary-light); }
        .map-toolbar .danger-btn { border-color: var(--danger); color: var(--danger); }
        .map-toolbar .danger-btn:hover { background: var(--danger-light); }
 
        /* ── Member List ── */
        .member-list { margin-top: 14px; }
        .member-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 6px; border-bottom: 1px solid var(--border);
            font-size: 14px; cursor: pointer; border-radius: 6px;
            transition: background .15s;
        }
        .member-item:last-child { border: none; }
        .member-item:hover { background: var(--primary-light); }
        .member-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .member-time { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
 
        /* ── Divider ── */
        .divider { border: none; border-top: 1px dashed var(--border); margin: 18px 0; }
 
        /* ── Modal ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.55); z-index: 9999;
            align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white; border-radius: 16px;
            padding: 28px 24px; max-width: 320px; width: 90%;
            text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.25);
        }
        .modal-icon { font-size: 44px; margin-bottom: 12px; }
        .modal-box h3 { font-size: 18px; margin-bottom: 8px; }
        .modal-box p  { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button {
            flex: 1; padding: 13px; border-radius: 10px;
            border: none; font-size: 14px; font-weight: 700;
            font-family: inherit; cursor: pointer;
        }
        .modal-cancel  { background: #f0f0f0; color: var(--text); }
        .modal-confirm { background: var(--danger); color: white; }
    </style>
</head>
<body>
 
<header>
    <div>
        <div class="logo">🗺️ PAL MAP 2.0</div>
        <div class="sub">旅遊團隊定位系統</div>
    </div>
    <div id="auth-badge">⏳ 連線中</div>
</header>
 
<nav>
    <button id="tab-register" class="active" onclick="showPage('register')">
        <span class="icon">📋</span>首次註冊
    </button>
    <button id="tab-report" onclick="showPage('report')" disabled>
        <span class="icon">📍</span>回報位置
    </button>
    <button id="tab-map" onclick="showPage('mapPage')" disabled>
        <span class="icon">🗺️</span>查看地圖
    </button>
</nav>
 
<!-- ══════ PAGE 1：首次註冊 ══════ -->
<div id="register" class="page active">
    <h2>首次註冊</h2>
    <p class="hint">第一次參加請在此輸入資料並送出位置。每台手機只需註冊一次。</p>
 
    <div class="form-group">
        <label>您的暱稱</label>
        <input type="text" id="reg-nickname" placeholder="例：小明">
    </div>
    <div class="form-group">
        <label>團隊編號（由導遊提供）</label>
        <input type="text" id="reg-tripcode" placeholder="例：TOUR2025">
    </div>
 
    <button class="btn btn-primary" id="btn-reg" onclick="handleRegister()" disabled>
        ⏳ 安全連線中，請稍候…
    </button>
    <div id="reg-result" class="result-box"></div>
</div>
 
<!-- ══════ PAGE 2：回報位置 ══════ -->
<div id="report" class="page">
    <h2>回報我的位置</h2>
 
    <div id="leave-banner">
        🚪 您已離開本次行程，地圖上不再顯示您的位置。<br>
        如需重新加入，請點擊下方「重新加入行程」。
    </div>
 
    <div class="info-card" id="saved-info-card" style="display:none">
        <div class="row"><span>暱稱</span><span class="val" id="saved-nickname-show">-</span></div>
        <div class="row"><span>團隊</span><span class="val" id="saved-tripcode-show">-</span></div>
        <div class="row"><span>上次回報</span><span class="val" id="last-report-time">尚未回報</span></div>
        <div class="row"><span>狀態</span><span class="val" id="member-status-show">✅ 行程中</span></div>
    </div>
 
    <!-- 行程中：顯示回報 + 離開 -->
    <div id="report-actions">
        <button class="btn btn-primary" id="btn-report" onclick="handleReport()" disabled>
            📍 立即回報目前位置
        </button>
 
        <hr class="divider">
 
        <p class="hint" style="color:#b02a2a;font-weight:600;margin-bottom:6px">⚠️ 離開行程</p>
        <p class="hint" style="margin-top:0">離開後您的位置將從地圖移除，其他成員無法看見您。您可以隨時重新加入。</p>
        <button class="btn btn-danger" id="btn-leave" onclick="confirmLeave()" disabled>
            🚪 我要離開行程
        </button>
    </div>
 
    <!-- 已離開：顯示重新加入 -->
    <div id="rejoin-actions" style="display:none">
        <button class="btn btn-outline" id="btn-rejoin" onclick="handleRejoin()" disabled>
            🔄 重新加入行程
        </button>
    </div>
 
    <div id="rep-result" class="result-box"></div>
</div>
 
<!-- ══════ PAGE 3：地圖 ══════ -->
<div id="mapPage" class="page">
    <h2>團員動態地圖</h2>
    <p class="hint">每 60 秒自動更新一次。點擊「立即更新」可手動刷新，點擊成員名稱可移動至其位置。</p>
 
    <div class="map-toolbar">
        <button onclick="fetchMapData()">🔄 立即更新</button>
        <button onclick="fitAllMarkers()">⊞ 全員顯示</button>
        <button class="danger-btn" onclick="confirmLeaveFromMap()">🚪 離開行程</button>
    </div>
 
    <div id="map"></div>
    <div class="member-list" id="member-list"></div>
</div>
 
<!-- ══════ 離開確認 Modal ══════ -->
<div class="modal-overlay" id="leave-modal">
    <div class="modal-box">
        <div class="modal-icon">🚪</div>
        <h3>確認離開行程？</h3>
        <p>離開後您的位置將從地圖上移除，其他團員將無法看到您。<br>您可以隨時選擇重新加入。</p>
        <div class="modal-actions">
            <button class="modal-cancel"  onclick="closeModal()">取消</button>
            <button class="modal-confirm" onclick="executeLeave()">確認離開</button>
        </div>
    </div>
</div>
 
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
 
    /* ════════════════════════════════════════
       🔧 請替換為您的 Firebase 設定
       ════════════════════════════════════════ */
    const firebaseConfig = {
        apiKey: "AIzaSyA58jfhZO7xVVDF8v54daa2i-YU2xUZEkQ",
        authDomain: "palmap-98faa.firebaseapp.com",
        databaseURL:       "https://palmap-98faa-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "palmap-98faa",
        storageBucket: "palmap-98faa.firebasestorage.app",
        messagingSenderId: "647835530592",
        appId: "1:647835530592:web:c6fbb642b23c4a52a31a05",
        measurementId: "G-VJPFD7YZP4"
    };
 
    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);
 
    /* ── 狀態變數 ── */
    let currentUID    = null;
    let savedNickname = '';
    let savedTripcode = '';
    let hasLeft       = false;
    let mapPollTimer  = null;
    let leafletMap    = null;
    let markers       = {};
    let currentBounds = null;
 
    const MAP_POLL_SEC = 60;
 
    /* ════════════════
       AUTH
       ════════════════ */
    signInAnonymously(auth).catch(() => {
        document.getElementById('auth-badge').textContent = "❌ 連線失敗";
    });
 
    onAuthStateChanged(auth, (user) => {
        if (!user) return;
        currentUID = user.uid;
        document.getElementById('auth-badge').textContent = "🔒 " + currentUID.slice(0, 6) + "…";
        document.getElementById('btn-reg').disabled    = false;
        document.getElementById('btn-reg').textContent = "📋 註冊並送出位置";
        loadSavedIdentity();
    });
 
    /* ════════════════
       IDENTITY
       ════════════════ */
    function loadSavedIdentity() {
        const nick = localStorage.getItem('pal_nickname') || '';
        const trip = localStorage.getItem('pal_tripcode') || '';
        const left = localStorage.getItem('pal_left') === '1';
        if (nick && trip) {
            savedNickname = nick;
            savedTripcode = trip;
            hasLeft       = left;
            updateIdentityUI();
            unlockTabs();
        }
    }
 
    function saveIdentity(nick, trip) {
        savedNickname = nick;
        savedTripcode = trip;
        localStorage.setItem('pal_nickname', nick);
        localStorage.setItem('pal_tripcode', trip);
    }
 
    function updateIdentityUI() {
        document.getElementById('saved-info-card').style.display    = 'block';
        document.getElementById('saved-nickname-show').textContent  = savedNickname;
        document.getElementById('saved-tripcode-show').textContent  = savedTripcode;
        applyLeaveState();
    }
 
    function applyLeaveState() {
        const banner        = document.getElementById('leave-banner');
        const reportActions = document.getElementById('report-actions');
        const rejoinActions = document.getElementById('rejoin-actions');
        const statusShow    = document.getElementById('member-status-show');
 
        if (hasLeft) {
            banner.style.display        = 'block';
            reportActions.style.display = 'none';
            rejoinActions.style.display = 'block';
            statusShow.textContent      = '🚪 已離開行程';
            statusShow.style.color      = 'var(--danger)';
        } else {
            banner.style.display        = 'none';
            reportActions.style.display = 'block';
            rejoinActions.style.display = 'none';
            statusShow.textContent      = '✅ 行程中';
            statusShow.style.color      = 'var(--primary)';
        }
    }
 
    function unlockTabs() {
        document.getElementById('tab-report').disabled = false;
        document.getElementById('tab-map').disabled    = false;
        document.getElementById('btn-report').disabled = false;
        document.getElementById('btn-leave').disabled  = false;
        document.getElementById('btn-rejoin').disabled = false;
    }
 
    /* ════════════════
       PAGE SWITCH
       ════════════════ */
    window.showPage = (pageId) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
 
        const tabId = pageId === 'mapPage'   ? 'map'
                    : pageId === 'register'  ? 'register'
                    : 'report';
        document.getElementById('tab-' + tabId).classList.add('active');
 
        if (pageId === 'mapPage') {
            setTimeout(() => {
                if (leafletMap) leafletMap.invalidateSize();
                else initMap();
                startMapPoll();
            }, 150);
        } else {
            stopMapPoll();
        }
    };
 
    /* ════════════════
       GEOLOCATION
       不使用快取（maximumAge:0），每次皆取最新 GPS
       ════════════════ */
    function getPosition() {
        return new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, {
                enableHighAccuracy: true,
                timeout:            12000,
                maximumAge:         3000
            });
        });
    }
 
    function geoErrMsg(err) {
        return (
            { 1: "請開啟 GPS 定位權限", 2: "定位服務不可用，請確認已開啟 GPS", 3: "定位請求逾時，請重試" }
        )[err.code] || err.message;
    }
 
    /* ════════════════
       HELPERS
       ════════════════ */
    function sanitizeTripcode(raw) {
        return raw.replace(/[.#$[\]/\s]/g, '_').substring(0, 40);
    }
 
    function fmtTime(d = new Date()) {
        return `${d.getMonth()+1}/${d.getDate()} ` +
               `${d.getHours().toString().padStart(2,'0')}:` +
               `${d.getMinutes().toString().padStart(2,'0')}`;
    }
 
    function showResult(el, type, html) {
        el.className = 'result-box show ' + type;
        el.innerHTML = html;
    }
 
    /* ════════════════
       REGISTER
       ════════════════ */
    window.handleRegister = async () => {
        if (!currentUID) { alert("尚未完成連線，請稍候"); return; }
 
        const nickname  = document.getElementById('reg-nickname').value.trim();
        const tripcode  = sanitizeTripcode(document.getElementById('reg-tripcode').value.trim());
        const resultDiv = document.getElementById('reg-result');
 
        if (!nickname || !tripcode) {
            showResult(resultDiv, 'error', "⚠️ 請填寫所有欄位");
            return;
        }
 
        showResult(resultDiv, 'loading', "⌛ 定位中，請稍候…");
        document.getElementById('btn-reg').disabled = true;
 
        try {
            const pos = await getPosition();
            const { latitude, longitude } = pos.coords;
            const timeStr = fmtTime();
 
            // 身分節點（驗證用）
            await set(ref(db, `users/${tripcode}/${currentUID}`), { nickname });
 
            // 位置節點（地圖顯示用）
            await set(ref(db, `locations/${tripcode}/${currentUID}`), {
                nickname, lat: latitude, lng: longitude, time: timeStr
            });
 
            // 清除離開旗標
            localStorage.removeItem('pal_left');
            hasLeft = false;
 
            saveIdentity(nickname, tripcode);
            unlockTabs();
            updateIdentityUI();
 
            showResult(resultDiv, 'success',
                `✅ 註冊成功！<br><b>${nickname}</b>（${tripcode}）<br>📍 時間：${timeStr}`);
        } catch (err) {
            showResult(resultDiv, 'error', "❌ " + (err.code ? geoErrMsg(err) : err.message));
        } finally {
            document.getElementById('btn-reg').disabled = false;
        }
    };
 
    /* ════════════════
       REPORT（純手動，無自動機制）
       ════════════════ */
    window.handleReport = async () => {
        if (!currentUID || !savedNickname || !savedTripcode) {
            showResult(document.getElementById('rep-result'), 'error', "⚠️ 請先完成首次註冊");
            return;
        }
        if (hasLeft) {
            showResult(document.getElementById('rep-result'), 'warning', "⚠️ 您已離開行程，請先點擊「重新加入行程」");
            return;
        }
 
        const resultDiv = document.getElementById('rep-result');
        showResult(resultDiv, 'loading', "⌛ 定位中…");
        document.getElementById('btn-report').disabled = true;
 
        try {
            const pos = await getPosition();
            const { latitude, longitude } = pos.coords;
            const timeStr = fmtTime();
 
            await set(ref(db, `locations/${savedTripcode}/${currentUID}`), {
                nickname: savedNickname, lat: latitude, lng: longitude, time: timeStr
            });
 
            document.getElementById('last-report-time').textContent = timeStr;
            showResult(resultDiv, 'success', `✅ 回報成功！<br>📍 時間：${timeStr}`);
        } catch (err) {
            showResult(resultDiv, 'error', "❌ " + (err.code ? geoErrMsg(err) : err.message));
        } finally {
            document.getElementById('btn-report').disabled = false;
        }
    };
 
    /* ════════════════
       LEAVE（離開行程）
       ════════════════ */
    window.confirmLeave        = () => openModal();
    window.confirmLeaveFromMap = () => openModal();
 
    function openModal() {
        document.getElementById('leave-modal').classList.add('show');
    }
 
    window.closeModal = () => {
        document.getElementById('leave-modal').classList.remove('show');
    };
 
    window.executeLeave = async () => {
        closeModal();
        if (!currentUID || !savedTripcode) return;
 
        try {
            // 從 DB 刪除自己的 location 記錄 → 所有人地圖上移除
            await remove(ref(db, `locations/${savedTripcode}/${currentUID}`));
 
            // 本機記錄離開狀態
            hasLeft = true;
            localStorage.setItem('pal_left', '1');
 
            // 移除地圖上自己的 marker（若在地圖頁）
            if (markers[currentUID] && leafletMap) {
                leafletMap.removeLayer(markers[currentUID]);
                delete markers[currentUID];
            }
 
            applyLeaveState();
 
            // 切回回報頁
            showPage('report');
            setTimeout(() => {
                showResult(document.getElementById('rep-result'), 'success',
                    "🚪 已成功離開行程，地圖上已移除您的位置。<br>如需重新加入，請點擊「重新加入行程」。");
            }, 100);
        } catch (err) {
            showResult(document.getElementById('rep-result'), 'error',
                "❌ 離開失敗：" + err.message);
        }
    };
 
    /* ════════════════
       REJOIN（重新加入）
       ════════════════ */
    window.handleRejoin = async () => {
        if (!currentUID || !savedNickname || !savedTripcode) return;
 
        const resultDiv = document.getElementById('rep-result');
        showResult(resultDiv, 'loading', "⌛ 重新定位並加入…");
        document.getElementById('btn-rejoin').disabled = true;
 
        try {
            const pos = await getPosition();
            const { latitude, longitude } = pos.coords;
            const timeStr = fmtTime();
 
            await set(ref(db, `locations/${savedTripcode}/${currentUID}`), {
                nickname: savedNickname, lat: latitude, lng: longitude, time: timeStr
            });
 
            hasLeft = false;
            localStorage.removeItem('pal_left');
            document.getElementById('last-report-time').textContent = timeStr;
            applyLeaveState();
            showResult(resultDiv, 'success', `✅ 已重新加入行程！<br>📍 時間：${timeStr}`);
        } catch (err) {
            showResult(resultDiv, 'error', "❌ " + (err.code ? geoErrMsg(err) : err.message));
        } finally {
            document.getElementById('btn-rejoin').disabled = false;
        }
    };
 
    /* ════════════════
       MAP（60 秒輪詢 Polling，使用 get() 單次讀取）
       ════════════════ */
    function initMap() {
        if (leafletMap) return;
        leafletMap = L.map('map').setView([23.5, 121], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap', maxZoom: 18
        }).addTo(leafletMap);
    }
 
    function startMapPoll() {
        if (!savedTripcode) return;
        stopMapPoll();
        fetchMapData();
        mapPollTimer = setInterval(fetchMapData, MAP_POLL_SEC * 1000);
    }
 
    function stopMapPoll() {
        clearInterval(mapPollTimer);
        mapPollTimer = null;
    }
 
    window.fetchMapData = async () => {
        if (!currentUID || !savedTripcode) return;
        if (!leafletMap) initMap();
 
        try {
            const snap = await get(ref(db, `locations/${savedTripcode}`));
            const data = snap.val();
            const memberList = document.getElementById('member-list');
 
            if (!data) {
                memberList.innerHTML = '<p style="font-size:13px;color:#888;padding:14px 0;text-align:center">📭 目前無成員資料</p>';
                return;
            }
 
            const bounds = [];
            memberList.innerHTML = '';
 
            for (const uid in data) {
                const item   = data[uid];
                const latlng = [item.lat, item.lng];
                const isMe   = uid === currentUID;
 
                if (markers[uid]) {
                    markers[uid].setLatLng(latlng);
                    markers[uid].getPopup().setContent(popupHtml(item, isMe));
                } else {
                    const icon = isMe ? makeIcon('#f0a500', '★') : makeIcon('#1a6b3c', '●');
                    markers[uid] = L.marker(latlng, { icon })
                        .bindPopup(popupHtml(item, isMe))
                        .addTo(leafletMap);
                }
                bounds.push(latlng);
 
                const row = document.createElement('div');
                row.className = 'member-item';
                row.innerHTML = `
                    <div class="member-dot" style="background:${isMe ? '#f0a500' : '#1a6b3c'}"></div>
                    <span>${item.nickname}${isMe ? ' <b>（我）</b>' : ''}</span>
                    <span class="member-time">⏱ ${item.time}</span>`;
                row.onclick = () => leafletMap.setView([item.lat, item.lng], 15);
                memberList.appendChild(row);
            }
 
            // 清除已離開（DB 已刪除）的 marker
            for (const uid in markers) {
                if (!data[uid]) {
                    leafletMap.removeLayer(markers[uid]);
                    delete markers[uid];
                }
            }
 
            if (bounds.length > 0) {
                currentBounds = L.latLngBounds(bounds);
                leafletMap.fitBounds(currentBounds, { padding: [50, 50] });
            }
        } catch (err) {
            console.error('地圖更新失敗', err);
        }
    };
 
    window.fitAllMarkers = () => {
        if (leafletMap && currentBounds) {
            leafletMap.fitBounds(currentBounds, { padding: [40, 40] });
        }
    };
 
    function popupHtml(item, isMe) {
        return `<b>${item.nickname}${isMe ? ' ⭐' : ''}</b><br>🕐 ${item.time}`;
    }
 
    function makeIcon(color, symbol) {
        return L.divIcon({
            className: '',
            html: `<div style="width:30px;height:30px;border-radius:50%;
                   background:${color};color:white;
                   display:flex;align-items:center;justify-content:center;
                   font-size:15px;font-weight:bold;
                   box-shadow:0 2px 8px rgba(0,0,0,.35);">${symbol}</div>`,
            iconSize:    [30, 30],
            iconAnchor:  [15, 15],
            popupAnchor: [0, -18]
        });
    }
 
    /* 公開給 HTML onclick 使用 */
    window.showPage             = window.showPage;
    window.handleRegister       = window.handleRegister;
    window.handleReport         = window.handleReport;
    window.confirmLeave         = window.confirmLeave;
    window.confirmLeaveFromMap  = window.confirmLeaveFromMap;
    window.closeModal           = window.closeModal;
    window.executeLeave         = window.executeLeave;
    window.handleRejoin         = window.handleRejoin;
    window.fetchMapData         = window.fetchMapData;
    window.fitAllMarkers        = window.fitAllMarkers;
</script>
</body>
</html>
