<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>友位 · 即時位置分享</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #13161e;
    --card: #1a1e2a;
    --border: #252a38;
    --accent: #4fffb0;
    --text: #e8eaf0;
    --muted: #6b7280;
  }

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
font-family: ‘Noto Sans TC’, sans-serif;
background: var(–bg);
color: var(–text);
height: 100%;
overflow: hidden;
}

/* ── 整體垂直排列 ── */
.app {
display: flex;
flex-direction: column;
height: 100dvh; /* dynamic viewport height，手機更準確 */
}

/* ── Header ── */
header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 10px 16px;
background: var(–panel);
border-bottom: 1px solid var(–border);
flex-shrink: 0;
z-index: 100;
}
.logo {
font-family: ‘Space Mono’, monospace;
font-size: 17px;
font-weight: 700;
color: var(–accent);
}
.logo span { color: var(–text); }

.status-pill {
display: flex;
align-items: center;
gap: 5px;
background: rgba(79,255,176,0.08);
border: 1px solid rgba(79,255,176,0.25);
border-radius: 20px;
padding: 4px 10px;
font-size: 11px;
color: var(–accent);
font-family: ‘Space Mono’, monospace;
}
.pulse {
width: 6px; height: 6px;
background: var(–accent);
border-radius: 50%;
animation: pulse 1.5s infinite;
}
@keyframes pulse {
0%,100%{ opacity:1; transform:scale(1); }
50%{ opacity:0.4; transform:scale(1.4); }
}

/* ── 地圖區域 ── */
.map-wrapper {
flex: 1;
position: relative;
min-height: 0; /* 讓 flex 正確壓縮 */
}
#map { width: 100%; height: 100%; }

.map-hint {
position: absolute;
top: 10px;
left: 50%;
transform: translateX(-50%);
background: rgba(13,15,20,0.82);
border: 1px solid var(–border);
border-radius: 20px;
padding: 5px 14px;
font-size: 11px;
color: var(–muted);
backdrop-filter: blur(8px);
z-index: 500;
pointer-events: none;
white-space: nowrap;
}

.locate-btn {
position: absolute;
bottom: 14px;
right: 14px;
width: 44px; height: 44px;
border-radius: 50%;
background: var(–panel);
border: 1px solid var(–border);
color: var(–accent);
font-size: 20px;
display: flex; align-items: center; justify-content: center;
cursor: pointer;
z-index: 500;
box-shadow: 0 4px 16px rgba(0,0,0,0.4);
transition: all 0.2s;
}
.locate-btn:active { transform: scale(0.93); background: var(–card); }

/* ── 底部成員列表 ── */
.bottom-panel {
flex-shrink: 0;
background: var(–panel);
border-top: 1px solid var(–border);
max-height: 38vh;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.bottom-panel::-webkit-scrollbar { display: none; }

.panel-handle {
display: flex;
align-items: center;
justify-content: space-between;
padding: 10px 16px 6px;
position: sticky;
top: 0;
background: var(–panel);
z-index: 10;
border-bottom: 1px solid var(–border);
}
.panel-title {
font-size: 11px;
font-family: ‘Space Mono’, monospace;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 1.2px;
}
.my-coord {
font-family: ‘Space Mono’, monospace;
font-size: 10px;
color: var(–accent);
}

/* 成員卡片：橫向滾動 */
.friends-scroll {
display: flex;
gap: 10px;
padding: 10px 14px 14px;
overflow-x: auto;
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
}
.friends-scroll::-webkit-scrollbar { display: none; }

.friend-card {
flex-shrink: 0;
width: 130px;
background: var(–card);
border: 1px solid var(–border);
border-radius: 14px;
padding: 12px 10px;
cursor: pointer;
transition: all 0.2s;
position: relative;
overflow: hidden;
}
.friend-card::after {
content: ‘’;
position: absolute;
bottom: 0; left: 0; right: 0;
height: 3px;
background: var(–fc, var(–accent));
border-radius: 0 0 14px 14px;
}
.friend-card:active { transform: scale(0.96); }
.friend-card.is-me { border-color: var(–accent); }

.fc-avatar {
width: 38px; height: 38px;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 18px;
margin: 0 auto 8px;
border: 2px solid var(–fc, var(–accent));
}
.fc-name {
text-align: center;
font-size: 13px;
font-weight: 700;
margin-bottom: 2px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.fc-status {
text-align: center;
font-size: 10px;
color: var(–muted);
margin-bottom: 8px;
}
.fc-distance {
text-align: center;
font-family: ‘Space Mono’, monospace;
font-size: 13px;
font-weight: 700;
color: var(–fc, var(–accent));
}
.fc-dist-label {
text-align: center;
font-size: 10px;
color: var(–muted);
margin-top: 1px;
}

/* ── 登入畫面 ── */
#loginScreen {
position: fixed; inset: 0; z-index: 9999;
background: var(–bg);
display: flex; align-items: center; justify-content: center;
}
.login-box {
background: var(–panel);
border: 1px solid var(–border);
border-radius: 20px;
padding: 36px 28px;
width: 88vw; max-width: 340px;
text-align: center;
}
.login-logo {
font-family: ‘Space Mono’, monospace;
font-size: 26px; font-weight: 700;
color: var(–accent); margin-bottom: 4px;
}
.login-sub { font-size: 12px; color: var(–muted); margin-bottom: 28px; }
.login-field { margin-bottom: 14px; text-align: left; }
.login-label {
display: block; font-size: 11px; color: var(–muted);
font-family: ‘Space Mono’, monospace; text-transform: uppercase;
letter-spacing: 1px; margin-bottom: 6px;
}
.login-input {
width: 100%; background: var(–card);
border: 1px solid var(–border); border-radius: 10px;
padding: 11px 14px; color: var(–text);
font-family: ‘Noto Sans TC’, sans-serif; font-size: 15px;
outline: none; transition: border-color 0.2s;
}
.login-input:focus { border-color: var(–accent); }
.login-error {
font-size: 12px; color: #f87171;
min-height: 18px; margin-bottom: 14px; text-align: left;
}
.login-btn {
width: 100%; background: var(–accent); color: #0d0f14;
border: none; border-radius: 10px; padding: 13px;
font-size: 15px; font-weight: 700;
font-family: ‘Noto Sans TC’, sans-serif;
cursor: pointer; transition: all 0.2s;
}
.login-btn:active { background: #6bffbe; transform: scale(0.98); }
.login-note { margin-top: 14px; font-size: 11px; color: var(–muted); line-height: 1.7; }

/* ── Leaflet overrides ── */
.leaflet-container { background: #f0f0f0; }
.leaflet-tile { filter: grayscale(0.85) brightness(1.05); }
.leaflet-control-zoom { margin: 10px !important; }
.leaflet-control-zoom a {
width: 32px !important; height: 32px !important;
line-height: 32px !important;
background: var(–panel) !important;
color: var(–text) !important;
border-color: var(–border) !important;
font-size: 16px !important;
}
.leaflet-control-attribution { display: none; }
.leaflet-popup-content-wrapper {
background: var(–card);
border: 1px solid var(–border);
border-radius: 12px;
color: var(–text);
font-family: ‘Noto Sans TC’, sans-serif;
box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.leaflet-popup-tip { background: var(–card); }
.leaflet-popup-content { margin: 10px 14px; font-size: 13px; }
</style>

</head>
<body>

<!-- ── 登入畫面 ── -->

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">友位</div>
    <div class="login-sub">即時位置分享</div>
    <div class="login-field">
      <label class="login-label">帳號</label>
      <input class="login-input" id="inputUser" placeholder="輸入帳號…"
        autocapitalize="none" autocomplete="username"
        onkeydown="if(event.key==='Enter') document.getElementById('inputPass').focus()">
    </div>
    <div class="login-field">
      <label class="login-label">密碼</label>
      <input class="login-input" id="inputPass" type="password" placeholder="輸入密碼…"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" onclick="doLogin()">登入 →</button>
    <div class="login-note">📡 登入後 GPS 位置將顯示在地圖上</div>
  </div>
</div>

<!-- ── 主畫面（登入後顯示）── -->

<div class="app" id="appScreen" style="display:none">

  <!-- Header -->

  <header>
    <div class="logo">友<span>位</span></div>
    <div class="status-pill"><div class="pulse"></div> 即時同步中</div>
  </header>

  <!-- Map -->

  <div class="map-wrapper">
    <div class="map-hint">💡 點擊地圖可移動你的位置</div>
    <div id="map"></div>
    <button class="locate-btn" onclick="locateMe()" title="回到我的位置">📍</button>
  </div>

  <!-- Bottom friends panel -->

  <div class="bottom-panel">
    <div class="panel-handle">
      <div class="panel-title">群組成員</div>
      <div class="my-coord" id="coordText">等待定位…</div>
    </div>
    <div class="friends-scroll" id="friendsScroll"></div>
  </div>

</div>

<script>
/* ── 帳號驗證（內建，不需 Firebase）── */
const ACCOUNTS = [
  { username: 'admin', password: '258000' },
];

function doLogin() {
  const user = document.getElementById('inputUser').value.trim();
  const pass = document.getElementById('inputPass').value;
  const err  = document.getElementById('loginError');

  if (!user || !pass) {
    err.textContent = '請輸入帳號與密碼';
    return;
  }
  const match = ACCOUNTS.find(a => a.username === user && a.password === pass);
  if (match) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display   = 'flex';
    startApp(); // 登入後才初始化地圖
  } else {
    err.textContent = '帳號或密碼錯誤，請重試';
    document.getElementById('inputPass').value = '';
    document.getElementById('inputPass').focus();
  }
}

/* ── 地圖 App ── */
function startApp() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => initMap(p.coords.latitude, p.coords.longitude),
      () => initMap(25.0330, 121.5654)
    );
  } else {
    initMap(25.0330, 121.5654);
  }
}
const FRIENDS = [
  { id: 'me',      name: '我',      emoji: '📍', color: '#1d4ed8', bg: 'rgba(29,78,216,0.15)' },
  { id: 'alice',   name: 'Alice',   emoji: '🌸', color: '#e11d48', bg: 'rgba(225,29,72,0.12)' },
  { id: 'bob',     name: 'Bob',     emoji: '🎮', color: '#0891b2', bg: 'rgba(8,145,178,0.12)' },
  { id: 'charlie', name: 'Charlie', emoji: '🎸', color: '#7c3aed', bg: 'rgba(124,58,237,0.12)' },
];

let map, markers = {}, positions = {};
let myLat = 25.0330, myLng = 121.5654;

/* ── Init ── */
function initMap(lat, lng) {
  myLat = lat; myLng = lng;

  map = L.map('map', { zoomControl: true, attributionControl: false })
         .setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  positions.me      = { lat, lng };
  positions.alice   = { lat: lat + 0.008, lng: lng - 0.012 };
  positions.bob     = { lat: lat - 0.006, lng: lng + 0.015 };
  positions.charlie = { lat: lat + 0.014, lng: lng + 0.008 };

  FRIENDS.forEach(f => addMarker(f));
  renderCards();
  updateCoord();

  map.on('click', e => {
    myLat = e.latlng.lat; myLng = e.latlng.lng;
    positions.me = { lat: myLat, lng: myLng };
    refreshMarker('me');
    renderCards();
    updateCoord();
  });
}

/* ── Markers ── */
function makeIcon(f) {
  const isMe = f.id === 'me';
  const size = isMe ? 46 : 38;
  return L.divIcon({
    className: '',
    html: `
      <div style="width:${size}px;height:${size}px;background:${f.bg};
        border:${isMe?'3':'2'}px solid ${f.color};border-radius:50%;
        display:flex;align-items:center;justify-content:center;font-size:${isMe?22:17}px;
        box-shadow:0 0 0 ${isMe?5:3}px ${f.color}28,0 3px 10px rgba(0,0,0,.35);">
        ${f.emoji}
      </div>
      <div style="text-align:center;margin-top:2px;font-family:'Noto Sans TC',sans-serif;
        font-size:11px;font-weight:700;color:${f.color};
        text-shadow:0 1px 4px rgba(0,0,0,.9);white-space:nowrap;">
        ${f.name}
      </div>`,
    iconSize: [size + 10, size + 18],
    iconAnchor: [(size + 10) / 2, size / 2],
    popupAnchor: [0, -(size / 2 + 4)],
  });
}

function addMarker(f) {
  const p = positions[f.id];
  markers[f.id] = L.marker([p.lat, p.lng], { icon: makeIcon(f) })
    .addTo(map)
    .bindPopup(popupHtml(f, p));
}

function refreshMarker(id) {
  const f = FRIENDS.find(x => x.id === id);
  const p = positions[id];
  markers[id].setLatLng([p.lat, p.lng]);
  markers[id].setIcon(makeIcon(f));
  markers[id].setPopupContent(popupHtml(f, p));
}

function popupHtml(f, p) {
  return `<div style="font-family:'Noto Sans TC',sans-serif">
    <div style="font-weight:700;font-size:14px;color:${f.color};margin-bottom:3px">${f.emoji} ${f.name}</div>
    <div style="font-family:'Space Mono',monospace;font-size:11px;color:#9ca3af">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>
  </div>`;
}

/* ── Cards ── */
function renderCards() {
  const scroll = document.getElementById('friendsScroll');
  scroll.innerHTML = '';

  FRIENDS.forEach(f => {
    const p = positions[f.id];
    const isMe = f.id === 'me';
    const dist = isMe ? null : calcDist(myLat, myLng, p.lat, p.lng);

    const card = document.createElement('div');
    card.className = 'friend-card' + (isMe ? ' is-me' : '');
    card.style.setProperty('--fc', f.color);
    card.innerHTML = `
      <div class="fc-avatar" style="background:${f.bg};border-color:${f.color}">${f.emoji}</div>
      <div class="fc-name">${f.name}</div>
      <div class="fc-status">${isMe ? '這是你' : '🟢 線上'}</div>
      ${isMe
        ? `<div class="fc-distance" style="color:var(--muted);font-size:11px">我的位置</div>`
        : `<div class="fc-distance">${dist}</div><div class="fc-dist-label">距離我</div>`
      }`;
    card.onclick = () => {
      map.setView([p.lat, p.lng], 16, { animate: true });
      markers[f.id].openPopup();
    };
    scroll.appendChild(card);
  });
}

/* ── Helpers ── */
function calcDist(a, b, c, d) {
  const R = 6371000;
  const dLat = (c - a) * Math.PI / 180;
  const dLng = (d - b) * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 +
            Math.cos(a*Math.PI/180) * Math.cos(c*Math.PI/180) * Math.sin(dLng/2)**2;
  const dist = R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  return dist < 1000 ? `${Math.round(dist)} 公尺` : `${(dist/1000).toFixed(1)} 公里`;
}

function updateCoord() {
  document.getElementById('coordText').textContent =
    `${myLat.toFixed(4)}, ${myLng.toFixed(4)}`;
}

function locateMe() {
  map.setView([myLat, myLng], 16, { animate: true });
  markers.me?.openPopup();
}
</script>

</body>
</html>
