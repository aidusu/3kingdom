<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTrackIn</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --ink: #0f1117;
  --paper: #f5f0e8;
  --moss: #3a5a40;
  --moss-light: #588157;
  --amber: #d4770a;
  --amber-light: #f4a261;
  --stone: #a98467;
  --mist: #e9e5dc;
  --danger: #c1440e;
  --success: #2d6a4f;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { font-family:'DM Sans',sans-serif; background:var(--ink); color:#fff; }
 
/* ── Bottom nav ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; z-index:1000;
  background:rgba(245,240,232,0.97);
  border-top:1.5px solid rgba(58,90,64,0.2);
  display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(15,17,23,0.08);
}
.nav-tab {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:10px 4px 8px;
  cursor:pointer; border:none; background:transparent;
  color:rgba(58,90,64,0.4);
  font-family:'DM Sans',sans-serif; font-size:0.68rem;
  letter-spacing:0.04em; gap:4px;
  transition:color 0.2s;
}
.nav-tab svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; }
.nav-tab.active { color:var(--moss); }
.nav-tab.active svg { stroke:var(--moss); }
 
/* ── Pages ── */
.page { display:none; height:100vh; overflow-y:auto; padding-bottom:70px; }
.page.active { display:flex; flex-direction:column; }
 
/* ════════════════════════════════
   PAGE 1 · LOGIN / REGISTER
════════════════════════════════ */
#page-login {
  background:var(--paper);
  align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
#page-login::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(58,90,64,0.12) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(212,119,10,0.08) 0%,transparent 50%);
  pointer-events:none;
}
#page-login::after {
  content:''; position:fixed; inset:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(58,90,64,0.06) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(58,90,64,0.06) 40px);
  pointer-events:none;
}
.login-card {
  position:relative; z-index:10;
  background:rgba(255,252,245,0.93);
  backdrop-filter:blur(12px);
  border:1.5px solid rgba(58,90,64,0.2);
  border-radius:4px;
  padding:40px 36px;
  width:min(420px,92vw);
  box-shadow:0 8px 40px rgba(15,17,23,0.14);
}
.logo-row { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
.logo-icon {
  width:34px; height:34px; background:var(--moss); border-radius:50%;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.logo-icon svg { width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2.2; }
.logo-text { font-family:'Syne',sans-serif; font-weight:800; font-size:1.25rem; color:var(--ink); letter-spacing:-0.4px; }
.logo-text span { color:var(--moss); }
 
.login-step { display:none; }
.login-step.active { display:block !important; }
.step-dots { display:flex; gap:6px; margin-bottom:20px; }
.step-dot { width:6px; height:6px; border-radius:50%; background:rgba(58,90,64,0.2); transition:background 0.3s; }
.step-dot.on { background:var(--moss); }
 
h2 { font-family:'Syne',sans-serif; font-size:1.5rem; font-weight:700; color:var(--ink); margin-bottom:5px; letter-spacing:-0.4px; }
.subtitle { font-size:0.875rem; color:var(--stone); margin-bottom:26px; line-height:1.5; }
 
.field { margin-bottom:18px; }
.field label { display:block; font-size:0.72rem; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--stone); margin-bottom:7px; }
.field input {
  width:100%; padding:11px 14px;
  background:var(--mist); border:1.5px solid transparent; border-radius:3px;
  font-family:'DM Sans',sans-serif; font-size:0.9375rem; color:var(--ink);
  outline:none; transition:border-color 0.2s,background 0.2s;
}
.field input:focus { border-color:var(--moss); background:#fff; }
.field input::placeholder { color:#c0b9af; }
 
.btn { width:100%; padding:13px; border:none; border-radius:3px; font-family:'Syne',sans-serif; font-size:0.9375rem; font-weight:700; cursor:pointer; letter-spacing:0.02em; transition:transform 0.15s,box-shadow 0.15s,opacity 0.15s; margin-top:6px; }
.btn-moss { background:var(--moss); color:#fff; box-shadow:0 4px 16px rgba(58,90,64,0.3); }
.btn-moss:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(58,90,64,0.4); }
.btn-moss:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
.btn-outline { background:transparent; color:var(--moss); border:1.5px solid var(--moss); margin-top:10px; }
.btn-outline:hover { background:rgba(58,90,64,0.06); }
 
.msg { margin-top:12px; padding:10px 13px; border-radius:3px; font-size:0.85rem; display:none; white-space:pre-line; line-height:1.5; }
.msg.error  { background:rgba(193,68,14,0.1); color:var(--danger); border:1px solid rgba(193,68,14,0.2); display:block; }
.msg.success{ background:rgba(58,90,64,0.1); color:var(--moss); border:1px solid rgba(58,90,64,0.2); display:block; }
.msg.info   { background:rgba(212,119,10,0.1); color:var(--amber); border:1px solid rgba(212,119,10,0.2); display:block; }
 
.existing-banner {
  background:rgba(58,90,64,0.07); border:1px solid rgba(58,90,64,0.15);
  border-radius:3px; padding:11px 14px; margin-bottom:18px;
  font-size:0.85rem; color:var(--moss); display:none;
}
.existing-banner.show { display:block; }
 
/* ════════════════════════════════
   PAGE 2 · CHECKIN
════════════════════════════════ */
#page-checkin { background:var(--paper); }
 
.page-header {
  padding:16px 18px 14px;
  border-bottom:1px solid rgba(58,90,64,0.15);
  flex-shrink:0;
  background:rgba(245,240,232,0.9);
}
.page-header-title { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; color:var(--ink); }
.page-header-sub { font-size:0.75rem; color:var(--stone); margin-top:2px; }
 
.checkin-body { padding:14px 16px; flex:1; position:relative; z-index:1; }
 
.user-card {
  background:rgba(255,252,245,0.9); border:1px solid rgba(58,90,64,0.18);
  border-radius:4px; padding:16px 18px; margin-bottom:14px;
  display:flex; align-items:center; gap:14px;
  box-shadow:0 2px 8px rgba(15,17,23,0.07);
}
.avatar {
  width:44px; height:44px; background:linear-gradient(135deg,var(--moss),var(--moss-light));
  border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.avatar svg { width:22px; height:22px; fill:none; stroke:#fff; stroke-width:1.8; }
.user-name { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; color:var(--ink); margin-bottom:3px; }
.user-trip { font-size:0.78rem; color:var(--stone); }
.user-trip strong { color:#6aaa75; font-weight:500; }
 
.section-label { font-size:0.68rem; font-weight:500; letter-spacing:0.12em; text-transform:uppercase; color:var(--stone); margin-bottom:10px; }
 
.dark-card {
  background:rgba(255,252,245,0.92); border:1px solid rgba(58,90,64,0.15);
  border-radius:4px; padding:18px; margin-bottom:12px;
  box-shadow:0 2px 8px rgba(15,17,23,0.07);
}
 
textarea {
  width:100%; background:var(--mist); border:1.5px solid transparent;
  border-radius:3px; color:var(--ink); font-family:'DM Sans',sans-serif; font-size:0.9rem;
  padding:11px 14px; resize:none; outline:none; transition:border-color 0.2s; min-height:76px; line-height:1.5;
}
textarea:focus { border-color:var(--moss); background:#fff; }
textarea::placeholder { color:#b5afa5; }
 
.gps-status { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:0.78rem; color:var(--stone); }
.gps-dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.18); flex-shrink:0; }
.gps-dot.ready  { background:#6aaa75; box-shadow:0 0 5px rgba(106,170,117,0.5); }
.gps-dot.waiting{ background:var(--amber); animation:blink 1.2s infinite; }
.gps-dot.error  { background:var(--danger); }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.25} }
 
.btn-checkin {
  width:100%; padding:16px; background:linear-gradient(135deg,var(--moss),var(--moss-light));
  border:none; border-radius:4px; font-family:'Syne',sans-serif; font-size:1.05rem; font-weight:700;
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px;
  box-shadow:0 5px 20px rgba(58,90,64,0.45); transition:transform 0.15s,box-shadow 0.15s,opacity 0.15s;
  letter-spacing:0.02em; margin-top:16px;
}
.btn-checkin:hover { transform:translateY(-2px); box-shadow:0 9px 28px rgba(58,90,64,0.6); }
.btn-checkin:active { transform:translateY(0); }
.btn-checkin:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
.btn-checkin svg { width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2; }
 
.btn-update {
  width:100%; padding:13px; background:transparent; border:1.5px solid rgba(212,119,10,0.45);
  border-radius:4px; font-family:'Syne',sans-serif; font-size:0.875rem; font-weight:600;
  color:var(--amber); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  transition:background 0.2s,border-color 0.2s; letter-spacing:0.02em;
}
.btn-update:hover { background:rgba(212,119,10,0.1); border-color:rgba(212,119,10,0.6); }
.btn-update svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; }
 
.history-item { padding:9px 0; border-bottom:1px solid rgba(58,90,64,0.1); display:flex; gap:11px; align-items:flex-start; }
.history-item:last-child { border-bottom:none; padding-bottom:0; }
.history-item:first-child { padding-top:0; }
.h-time { font-size:0.72rem; color:var(--stone); white-space:nowrap; margin-top:2px; flex-shrink:0; }
.h-note { font-size:0.85rem; color:var(--ink); line-height:1.4; }
.h-coord { font-size:0.68rem; color:rgba(106,170,117,0.55); margin-top:2px; }
.empty-text { font-size:0.85rem; color:var(--stone); text-align:center; padding:6px; }
 
.offline-badge {
  display:none; align-items:center; gap:7px; padding:8px 13px;
  background:rgba(212,119,10,0.1); border:1px solid rgba(212,119,10,0.3);
  border-radius:3px; font-size:0.78rem; color:var(--amber); margin-bottom:12px;
}
.offline-badge.show { display:flex; }
.offline-badge svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; flex-shrink:0; }
 
/* toast */
.toast {
  position:fixed; top:16px; left:50%; transform:translateX(-50%);
  z-index:2000; background:var(--success); color:#fff;
  padding:11px 22px; border-radius:40px; font-family:'Syne',sans-serif;
  font-weight:600; font-size:0.9rem; box-shadow:0 4px 18px rgba(0,0,0,0.35);
  opacity:0; transition:opacity 0.3s,transform 0.3s; pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(4px); }
.toast.err { background:var(--danger); }


 
/* ── Shared spinner ── */
.spinner {
  display:inline-block; width:13px; height:13px;
  border:2px solid rgba(255,255,255,0.25); border-top-color:#fff;
  border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:5px;
}
.spinner-sm {
  display:inline-block; width:11px; height:11px;
  border:1.5px solid rgba(255,255,255,0.18); border-top-color:var(--amber-light);
  border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle; margin-right:4px;
}
@keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
